<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asignar recursos · SMG</title>
  <link rel="icon" href="/Imagenes/smg-icono-192.png">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/shell.js"></script>
</head>

<body data-titulo="Asignar recursos">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content" id="contenido">
      <div class="page-head">
        <div>
          <h1>Asignar recursos</h1>
          <p class="page-sub">Completá todos los ítems para asignar recursos al viaje aprobado</p>
        </div>
      </div>

      <form id="form" class="card form-wide form" novalidate autocomplete="off">
        <div class="card-head"><h2 class="card-title">Orden de salida</h2></div>
        <div class="card-body">
          <fieldset>
            <legend>Viaje</legend>
            <div class="form-grid">
              <label class="field span-all">Viaje aprobado<select id="id_viaje" class="select" required onchange="completarDatosViaje()"></select></label>
              <label class="field">Fecha<input type="date" id="fecha" class="input" required readonly></label>
              <label class="field">Centro de costo<select id="centro_costo" class="select" required><option value="">Seleccione el centro de costo</option></select></label>
              <label class="field">Solicitante<input type="text" id="datos_solicitante" class="input" readonly></label>
              <label class="field">Área solicitante<input type="text" id="area_solicitante" class="input" readonly></label>
              <label class="field">Partida<input type="text" id="partida" class="input" readonly></label>
              <label class="field">Destino<input type="text" id="destino" class="input" readonly></label>
              <label class="field span-all">Motivo del viaje<input type="text" id="motivo_viaje" class="input" readonly></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Fechas y horarios</legend>
            <div class="form-grid">
              <label class="field">Fecha de salida<input type="date" id="fecha_salida_viaje" class="input"></label>
              <label class="field">Fecha de regreso<input type="date" id="fecha_regreso_viaje" class="input"></label>
              <label class="field">Duración estimada (jornadas)<input type="text" id="duracion_jornadas" class="input num" placeholder="0" readonly></label>
              <label class="field">Ingreso a base (estimado)<input type="time" id="hora_ingreso_base" class="input"></label>
              <label class="field">Salida (estimada)<input type="time" id="hora_salida" class="input"></label>
              <label class="field">Regreso (estimado)<input type="time" id="hora_regreso" class="input"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Itinerario y rutas</legend>
            <div class="form-grid">
              <label class="field">Itinerario<textarea id="itinerario" class="textarea" rows="4" placeholder="Itinerario del viaje"></textarea></label>
              <label class="field">Rutas<textarea id="rutas" class="textarea" rows="4" placeholder="Rutas previstas"></textarea></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Chofer y vehículo</legend>
            <div class="form-grid">
              <label class="field">Chofer<input type="text" id="chofer" class="input" list="lista-choferes" placeholder="Seleccionar o escribir chofer" required></label>
              <label class="field">Viático del chofer ($)<input type="number" id="viatico_chofer" class="input num" placeholder="0" min="0" step="0.01"></label>
              <label class="field span-all">Vehículo<input type="text" id="vehiculo" class="input" list="lista-vehiculos" placeholder="Seleccionar o escribir vehículo" required></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Acompañantes y viáticos</legend>
            <div class="card table-scroll">
              <table class="tbl tbl-edit">
                <colgroup><col><col style="width:180px"><col style="width:96px"></colgroup>
                <thead><tr><th>Acompañante</th><th class="right">Viático ($)</th><th><span class="sr-only">Quitar</span></th></tr></thead>
                <tbody id="acompanantes-container"></tbody>
              </table>
            </div>
            <div class="cell-flex" style="margin-top:var(--s3)">
              <button class="btn btn-sm" type="button" id="btn-add-acomp"><svg class="i i-sm"><use href="#i-plus"/></svg>Agregar acompañante</button>
            </div>
            <div class="form-grid" style="margin-top:var(--s3)">
              <label class="field">Total viáticos ($)<input type="number" id="viaticos" class="input num" min="0" step="0.01" readonly></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Recursos económicos</legend>
            <div class="form-grid">
              <label class="field">Viáticos ($)<input type="number" id="viaticos_monto" class="input num" min="0" step="0.01" readonly></label>
              <label class="field">Medio de pago<select id="medio_pago" class="select"><option value="Caja">Caja</option><option value="Transferencia">Transferencia</option></select></label>
              <label class="field">Alojamiento<select id="alojamiento" class="select"><option value="NO">No</option><option value="SI">Sí</option></select></label>
              <label class="field">Otros gastos ($)<input type="number" id="otros_gastos" class="input num" placeholder="0" min="0" step="0.01"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Comprobación de operaciones y logística</legend>
            <div class="form-grid">
              <label class="field">Taller<select id="comp_taller" class="select"><option value="SI">Sí</option><option value="NO" selected>No</option><option value="NO VERIFICADO">No verificado</option></select></label>
              <label class="field">RRHH<select id="comp_rrhh" class="select"><option value="SI" selected>Sí</option><option value="NO">No</option><option value="NO VERIFICADO">No verificado</option></select></label>
              <label class="field">Administración<select id="comp_administracion" class="select"><option value="SI">Sí</option><option value="NO" selected>No</option><option value="NO VERIFICADO">No verificado</option></select></label>
              <label class="field">Logística y operaciones<select id="comp_logistica_operaciones" class="select"><option value="SI">Sí</option><option value="NO">No</option><option value="NO VERIFICADO" selected>No verificado</option></select></label>
            </div>
          </fieldset>
        </div>
        <div class="card-foot">
          <span id="mensaje" class="help" role="status"></span>
          <span class="spacer"></span>
          <button type="button" class="btn btn-primary" id="btn-asignar">Asignar recursos</button>
        </div>
      </form>
      <datalist id="lista-choferes"></datalist>
      <datalist id="lista-vehiculos"></datalist>
      <datalist id="lista-acompanantes"></datalist>
    </main>
  </div>
</div>

<script>
let viajesAprobados = [];
let personalData = [];
const MAX_ACOMPANANTES = 20;

const RUTAS_PREDEFINIDAS = {
  pirquitas: `Ruta a Mina Pirquitas: https://goo.gl/maps/J2eKSevacZpjUXKM8\n- SMG Taller\n- RP1, Palpala, Jujuy\n- Sigue por RP1 hacia RN9 en San Salvador de Jujuy. (10,8 km)\n- Sigue por RN9 hacia Cochinoca. (210 km)\n- Toma RP74 hacia RN40. (72,2 km)\n- Gira a la derecha con direccion a RN40. (23,0 km)\n- Conduce hacia Camino. (11,8 km)\n- Mina Pirquitas`,
  exar: `Ruta a Minera Exar: https://goo.gl/maps/RtHAzvosWucxWsff7\n- SMG Taller\n- RP1, Palpala, Jujuy\n- Sigue por RP1 hacia RN66 en San Salvador de Jujuy. (10,6 km)\n- Sigue por RN9 y RN52 hacia Susques.\n- (256 km) Gira a la izquierda.\n- Puesto 52`,
  sdj: `Ruta a Sales de Jujuy: https://goo.gl/maps/YefZNvGzLwDPdmWV8\n- SMG Taller\n- RP1, Palpala, Jujuy\n- Sigue por RP1 hacia RN66 en San Salvador de Jujuy. (10,6 km)\n- Sigue por RN9 y RN52 hacia RP70 en Susques. (259 km)\n- RP70 (9,0 km)\n- Sales de Jujuy S.A. - Planta Carbonato de Litio`
};

function normalizarDestino(texto) {
  return (texto || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function obtenerRutaPredefinida(destino) {
  const d = normalizarDestino(destino);

  if (d.includes("pirquitas")) {
    return RUTAS_PREDEFINIDAS.pirquitas;
  }
  if (d.includes("exar")) {
    return RUTAS_PREDEFINIDAS.exar;
  }
  if (d.includes("sales de jujuy") || d.includes("sdj")) {
    return RUTAS_PREDEFINIDAS.sdj;
  }

  return "Otras: el encargado de Obra se encarga de establecer una ruta segura.";
}

function actualizarListasPersonal() {
  const listaChoferes = document.getElementById("lista-choferes");
  const listaAcompanantes = document.getElementById("lista-acompanantes");

  listaChoferes.innerHTML = "";
  listaAcompanantes.innerHTML = "";

  personalData
    .filter(p => (p.activo || "ACTIVO") !== "INACTIVO")
    .forEach(p => {
    const option = document.createElement("option");
    option.value = p.nombre || "";
    listaChoferes.appendChild(option);

    const optionAcomp = document.createElement("option");
    optionAcomp.value = p.nombre || "";
    listaAcompanantes.appendChild(optionAcomp);
  });
}

async function cargarViajes() {
  const [resViajes, resOrdenes] = await Promise.all([
    fetch("/viajes"),
    fetch("/ordenes")
  ]);
  const data = await resViajes.json();
  const ordenes = await resOrdenes.json();
  const idsConOrden = new Set((Array.isArray(ordenes) ? ordenes : []).map(o => o.id_viaje));

  const select = document.getElementById("id_viaje");
  select.innerHTML = "";

  viajesAprobados = data.filter(v => v.estado === "APROBADO" && !idsConOrden.has(v.id) && !v.orden_salida_generada);

  viajesAprobados.forEach(v => {
    const option = document.createElement("option");
    option.value = v.id;
    option.text = `ID ${v.id} - ${v.solicitante} (${v.destino})`;
    select.appendChild(option);
  });

  if (viajesAprobados.length === 0) {
    document.getElementById("mensaje").className = "help";
    document.getElementById("mensaje").textContent = "No hay viajes aprobados disponibles para generar Orden de salida.";
  } else {
    document.getElementById("mensaje").textContent = "";
  }

  completarDatosViaje();
}

function completarDatosViaje() {
  const hoy = new Date().toISOString().slice(0, 10);

  const idSeleccionado = parseInt(document.getElementById("id_viaje").value || "0");
  const viaje = viajesAprobados.find(v => v.id === idSeleccionado);

  document.getElementById("fecha").value = hoy;
  document.getElementById("datos_solicitante").value = viaje?.solicitante || "";
  document.getElementById("area_solicitante").value = viaje?.area || "";
  document.getElementById("partida").value = viaje?.origen || "";
  document.getElementById("destino").value = viaje?.destino || "";
  document.getElementById("motivo_viaje").value = viaje?.motivo || "";
  document.getElementById("fecha_salida_viaje").value = viaje?.fecha_salida || "";
  document.getElementById("fecha_regreso_viaje").value = viaje?.fecha_regreso || "";
  document.getElementById("hora_ingreso_base").value = viaje?.hora_ingreso_base || "";
  document.getElementById("hora_salida").value = viaje?.hora_salida || "";
  document.getElementById("hora_regreso").value = viaje?.hora_regreso || "";
  document.getElementById("itinerario").value = viaje?.itinerario || viaje?.intinerario || "";
  document.getElementById("rutas").value = viaje?.rutas || obtenerRutaPredefinida(viaje?.destino);

  actualizarDuracionDesdeFechas();

  actualizarListasPersonal();
}

function calcularTotalViaticos() {
  const viaticoChofer = parseFloat(document.getElementById("viatico_chofer").value || 0);

  const viaticosAcomp = Array.from(document.querySelectorAll(".input-viatico-acomp"))
    .map(input => parseFloat(input.value || 0))
    .reduce((acc, val) => acc + val, 0);

  const viaticos = viaticoChofer + viaticosAcomp;

  const total = viaticos.toFixed(2);
  document.getElementById("viaticos").value = total;
  document.getElementById("viaticos_monto").value = total;
}

function crearFilaAcompanante(nombre = "", viatico = "") {
  const cont = document.getElementById("acompanantes-container");
  const cantidadActual = cont.querySelectorAll(".acomp-row").length;

  if (cantidadActual >= MAX_ACOMPANANTES) {
    const mensaje = document.getElementById("mensaje");
    mensaje.className = "field-error";
    mensaje.textContent = `Máximo ${MAX_ACOMPANANTES} acompañantes.`;
    return;
  }

  const fila = document.createElement("tr");
  fila.className = "acomp-row";
  fila.innerHTML = `
    <td><input type="text" class="input input-acomp" list="lista-acompanantes" placeholder="Nombre del acompañante" aria-label="Acompañante" value="${SMG.escapeHtml(nombre)}"></td>
    <td><input type="number" class="input num input-viatico-acomp" placeholder="0" min="0" step="0.01" aria-label="Viático" value="${SMG.escapeHtml(viatico)}"></td>
    <td class="center"><button type="button" class="btn btn-ghost btn-sm btn-remove">Quitar</button></td>
  `;

  fila.querySelector(".btn-remove").addEventListener("click", () => {
    fila.remove();
    calcularTotalViaticos();
  });

  fila.querySelector(".input-viatico-acomp").addEventListener("input", calcularTotalViaticos);

  cont.appendChild(fila);
}

function resetAcompanantes() {
  const cont = document.getElementById("acompanantes-container");
  cont.innerHTML = "";
  crearFilaAcompanante();
}

function calcularDuracionJornadas(fechaSalida, fechaRegreso) {
  if (!fechaSalida || !fechaRegreso) {
    return 0;
  }

  const salida = new Date(`${fechaSalida}T00:00:00`);
  const regreso = new Date(`${fechaRegreso}T00:00:00`);
  const msPorDia = 24 * 60 * 60 * 1000;
  const diferencia = Math.floor((regreso - salida) / msPorDia) + 1;

  return diferencia > 0 ? diferencia : 0;
}

function actualizarDuracionDesdeFechas() {
  const salidaInput = document.getElementById("fecha_salida_viaje");
  const regresoInput = document.getElementById("fecha_regreso_viaje");

  regresoInput.min = salidaInput.value || "";

  if (salidaInput.value && regresoInput.value && regresoInput.value < salidaInput.value) {
    regresoInput.value = salidaInput.value;
  }

  const jornadas = calcularDuracionJornadas(salidaInput.value, regresoInput.value);
  document.getElementById("duracion_jornadas").value = jornadas > 0 ? String(jornadas) : "";
}

function generarPDF(data, nroOrden) {
  const vehiculoTexto = data.vehiculo || "";
  const partesVehiculo = vehiculoTexto.split(" - ");
  const marcaModelo = (partesVehiculo[2] || "").trim();
  const marcaModeloPartes = marcaModelo.split(" ");

  const payloadPDF = {
    nro_orden: nroOrden || "",
    id: data.id_viaje,
    fecha: data.fecha,
    centro_costo: data.centro_costo,
    solicitante: data.datos_solicitante,
    area: data.area_solicitante,
    origen: data.partida,
    destino: data.destino,
    motivo: data.motivo_viaje,
    fecha_salida: data.fecha_salida_viaje,
    fecha_regreso: data.fecha_regreso_viaje,
    hora_ingreso_base: data.hora_ingreso_base,
    hora_salida: data.hora_salida,
    hora_regreso: data.hora_regreso,
    duracion_jornadas: data.duracion_jornadas,
    itinerario: data.itinerario,
    rutas: data.rutas,
    vehiculo: partesVehiculo[0] || vehiculoTexto,
    dominio: partesVehiculo[1] || "",
    marca: marcaModeloPartes[0] || "",
    modelo: marcaModeloPartes.slice(1).join(" ") || "",
    chofer: data.chofer,
    chofer_viatico: data.chofer_viatico,
    acompanantes: (data.acompanantes || []).join(", "),
    acompanantes_con_viatico: data.acompanantes_con_viatico || [],
    viaticos: data.viaticos,
    medio_pago: data.medio_pago,
    alojamiento: data.alojamiento,
    otros_gastos: data.otros_gastos,
    comprobacion_operaciones_logistica: data.comprobacion_operaciones_logistica || {}
  };

  localStorage.setItem("viaje_pdf", JSON.stringify(payloadPDF));
  window.open("/print_viaje");
}

async function cargarVehiculos() {
  const res = await fetch("/vehiculos");
  const data = await res.json();

  const listaVehiculos = document.getElementById("lista-vehiculos");
  listaVehiculos.innerHTML = "";

  data.forEach(v => {
    const option = document.createElement("option");
    const codigo = v.codigo || "";
    const dominio = v.dominio || "S/D";
    const marcaModelo = `${v.marca || ""} ${v.modelo || ""}`.trim() || "Sin modelo";
    const operativo = v.operativo || "NO";
    option.value = `${codigo} - ${dominio} - ${marcaModelo} - Operativo: ${operativo}`;
    listaVehiculos.appendChild(option);
  });
}

async function cargarChoferes() {
  const res = await fetch("/personal");
  personalData = await res.json();
  actualizarListasPersonal();
}

async function procesarAsignacionRecursos() {
  const form = document.getElementById("form");
  if (!form.reportValidity()) {
    return;
  }

  try {
    if (viajesAprobados.length === 0) {
      const mensaje = document.getElementById("mensaje");
      mensaje.className = "field-error";
      mensaje.textContent = "No hay viajes disponibles para asignar.";
      return;
    }

    const hoy = new Date().toISOString().slice(0, 10);
    document.getElementById("fecha").value = hoy;
    calcularTotalViaticos();

    const acompanantesDetalle = Array.from(document.querySelectorAll("#acompanantes-container .acomp-row")).map(row => ({
      nombre: row.querySelector(".input-acomp")?.value.trim() || "",
      viatico: parseFloat(row.querySelector(".input-viatico-acomp")?.value || 0)
    }));

    const acompanantes = acompanantesDetalle
      .map(a => a.nombre)
      .filter(n => n.length > 0);

    const acompanantes_con_viatico = acompanantesDetalle
      .filter(a => a.nombre.length > 0 || a.viatico > 0);

    const mensaje = document.getElementById("mensaje");

    const data = {
      id_viaje: parseInt(document.getElementById("id_viaje").value),
      fecha: document.getElementById("fecha").value,
      centro_costo: document.getElementById("centro_costo").value,
      datos_solicitante: document.getElementById("datos_solicitante").value,
      area_solicitante: document.getElementById("area_solicitante").value,
      partida: document.getElementById("partida").value,
      destino: document.getElementById("destino").value,
      motivo_viaje: document.getElementById("motivo_viaje").value,
      fecha_salida_viaje: document.getElementById("fecha_salida_viaje").value,
      fecha_regreso_viaje: document.getElementById("fecha_regreso_viaje").value,
      hora_ingreso_base: document.getElementById("hora_ingreso_base").value,
      hora_salida: document.getElementById("hora_salida").value,
      hora_regreso: document.getElementById("hora_regreso").value,
      duracion_jornadas: document.getElementById("duracion_jornadas").value,
      itinerario: document.getElementById("itinerario").value,
      rutas: document.getElementById("rutas").value,
      paradas: "",
      chofer: document.getElementById("chofer").value,
      chofer_viatico: parseFloat(document.getElementById("viatico_chofer").value || 0),
      vehiculo: document.getElementById("vehiculo").value,
      acompanantes: acompanantes,
      acompanantes_con_viatico: acompanantes_con_viatico,
      viaticos: parseFloat(document.getElementById("viaticos").value || 0),
      medio_pago: document.getElementById("medio_pago").value,
      alojamiento: document.getElementById("alojamiento").value,
      otros_gastos: parseFloat(document.getElementById("otros_gastos").value || 0),
      comprobacion_operaciones_logistica: {
        taller: document.getElementById("comp_taller").value,
        rrhh: document.getElementById("comp_rrhh").value,
        administracion: document.getElementById("comp_administracion").value,
        logistica_operaciones: document.getElementById("comp_logistica_operaciones").value
      }
    };

    const res = await fetch("/recursos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (result.error) {
      mensaje.className = "field-error";
      mensaje.textContent = result.error;
      return;
    }

    mensaje.className = "help";
    mensaje.textContent = `Recursos asignados correctamente. Orden generada: ${result.nro_orden || "SIN NUMERO"}`;
    generarPDF(data, result.nro_orden);
    document.getElementById("form").reset();
    resetAcompanantes();
    calcularTotalViaticos();
  } catch (error) {
    console.error("Error al asignar recursos:", error);
    const mensaje = document.getElementById("mensaje");
    mensaje.className = "field-error";
    mensaje.textContent = "No se pudo asignar recursos.";
  }
}

async function cargarCentrosCosto() {
  const select = document.getElementById("centro_costo");
  try {
    const res = await fetch("/recursos/centros-costos");
    const centros = await res.json();
    centros.forEach(c => {
      const op = document.createElement("option");
      op.value = String(c.id);
      op.textContent = `${c.id} - ${c.nombre}`;
      select.appendChild(op);
    });
  } catch (error) {
    console.error("Error al cargar centros de costo:", error);
  }
  const otro = document.createElement("option");
  otro.value = "OTRO";
  otro.textContent = "OTRO";
  select.appendChild(otro);
}

cargarCentrosCosto();
cargarViajes();
cargarVehiculos();
cargarChoferes();
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();
});
document.getElementById("btn-asignar").addEventListener("click", procesarAsignacionRecursos);
document.getElementById("fecha_salida_viaje").addEventListener("change", actualizarDuracionDesdeFechas);
document.getElementById("fecha_regreso_viaje").addEventListener("change", actualizarDuracionDesdeFechas);
document.getElementById("viatico_chofer").addEventListener("input", calcularTotalViaticos);
document.getElementById("btn-add-acomp").addEventListener("click", () => crearFilaAcompanante());

resetAcompanantes();
</script>
</body>
</html>

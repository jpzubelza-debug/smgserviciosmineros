<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operaciones</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --bg-3: #0b1120;
    --panel: rgba(15, 23, 42, 0.66);
    --panel-soft: rgba(15, 23, 42, 0.45);
    --line: rgba(148, 163, 184, 0.35);
    --text: #e2e8f0;
    --muted: #93c5fd;
    --accent: #38bdf8;
    --accent-2: #22c55e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
  }

  .bg-photo {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url('/Imagenes/fondo_de_pantalla_dashboard.PNG') center/cover no-repeat;
    opacity: 0.66;
    pointer-events: none;
  }

  .bg-blur {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.2), transparent 48%),
      radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.18), transparent 45%);
  }

  .app-shell {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 14px;
    min-height: 100vh;
    padding: 14px;
    transition: grid-template-columns 0.22s ease;
  }

  .app-shell:has(.sidebar:hover),
  .app-shell:has(.sidebar:focus-within) {
    grid-template-columns: 250px minmax(0, 1fr);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(2, 6, 23, 0.4);
  }

  .sidebar {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    overflow: hidden;
    transition: width 0.22s ease;
  }

  .sidebar:hover,
  .sidebar:focus-within {
    width: 250px;
  }

  .brand {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 120px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .brand img {
    width: 78%;
    max-width: 170px;
    object-fit: contain;
  }

  .sidebar:not(:hover):not(:focus-within) .brand img {
    width: 44px;
  }

  .menu {
    display: grid;
    gap: 8px;
  }

  .menu button {
    border: 1px solid rgba(148, 163, 184, 0.4);
    background: rgba(15, 23, 42, 0.55);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
  }

  .sidebar:not(:hover):not(:focus-within) .menu button {
    text-indent: -9999px;
    padding-left: 0;
    padding-right: 0;
  }

  .menu button.active {
    background: linear-gradient(135deg, #1d4ed8, #0284c7);
    border-color: rgba(147, 197, 253, 0.8);
  }

  .main {
    display: grid;
    gap: 12px;
    min-width: 0;
  }

  .top {
    padding: 16px 18px;
  }

  .top h1 { margin: 0; font-size: 24px; }
  .top p { margin: 6px 0 0; color: #bfdbfe; font-size: 13px; }

  .content-panel {
    padding: 16px;
    display: grid;
    gap: 12px;
  }

  .hidden { display: none; }

  .section-card {
    padding: 16px;
    min-height: 180px;
  }

  .section-card h2 { margin: 0 0 8px; font-size: 20px; }
  .section-card p { margin: 0; color: #bfdbfe; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-blur"></div>
<div class="app-shell">
  <aside class="sidebar card">
    <div class="brand">
      <img src="/Imagenes/09-smg.png" alt="Logo SMG">
    </div>
    <div class="menu">
      <button class="active" id="btn-dashboard-operaciones" type="button">Dashboard</button>
      <button id="btn-carga-partes-diarios" type="button">Carga de Partes Diarios</button>
    </div>
  </aside>

  <main class="main">
    <section class="card top">
      <h1>Operaciones</h1>
      <p>Seguimiento operativo integral, productividad y alertas en tiempo real.</p>
    </section>

    <section class="content-panel card section-card" id="dashboard-operaciones-panel">
      <h2>Dashboard</h2>
      <p>Próximamente: indicadores y alertas del módulo de Operaciones.</p>
    </section>

    <section class="content-panel card section-card hidden" id="carga-partes-diarios-panel">
      <h2>Carga de Partes Diarios</h2>
      <p>Próximamente: formulario de carga de partes diarios.</p>
    </section>
  </main>
</div>

<script>
  const btnDashboard = document.getElementById('btn-dashboard-operaciones');
  const btnCargaPartes = document.getElementById('btn-carga-partes-diarios');
  const panelDashboard = document.getElementById('dashboard-operaciones-panel');
  const panelCargaPartes = document.getElementById('carga-partes-diarios-panel');

  function mostrarDashboard() {
    panelDashboard.classList.remove('hidden');
    panelCargaPartes.classList.add('hidden');
    btnDashboard.classList.add('active');
    btnCargaPartes.classList.remove('active');
  }

  function mostrarCargaPartes() {
    panelCargaPartes.classList.remove('hidden');
    panelDashboard.classList.add('hidden');
    btnCargaPartes.classList.add('active');
    btnDashboard.classList.remove('active');
  }

  btnDashboard.addEventListener('click', mostrarDashboard);
  btnCargaPartes.addEventListener('click', mostrarCargaPartes);
</script>
</body>
</html>

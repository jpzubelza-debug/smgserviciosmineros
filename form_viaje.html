<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud de viaje · SMG</title>
  <link rel="icon" href="/Imagenes/smg-icono-192.png">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/shell.js"></script>
</head>

<body data-titulo="Solicitud de viaje">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content" id="contenido">
      <div class="page-head">
        <div>
          <h1>Solicitud de viaje</h1>
          <p class="page-sub">Completá los datos del viaje para enviarlo a aprobación</p>
        </div>
      </div>

      <form id="form" class="card form-narrow form" novalidate autocomplete="off">
        <div class="card-head"><h2 class="card-title">Datos del viaje</h2></div>
        <div class="card-body">
          <fieldset>
            <legend>Solicitud</legend>
            <div class="form-grid">
              <label class="field">Solicitante<input type="text" id="solicitante" class="input" placeholder="Nombre y apellido" required></label>
              <label class="field">Área<input type="text" id="area" class="input" list="areas" required></label>
              <label class="field">Origen<input type="text" id="origen" class="input" required></label>
              <label class="field">Destino<input type="text" id="destino" class="input" list="destinos" required></label>
              <label class="field span-all">Motivo<textarea id="motivo" class="textarea" rows="3" required></textarea></label>
              <label class="field">Fecha de salida<input type="date" id="fecha_salida" class="input" required></label>
              <label class="field">Fecha de regreso<input type="date" id="fecha_regreso" class="input" required></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Recursos</legend>
            <div class="form-grid">
              <label class="field">Chofer<select id="chofer" class="select" required><option value="">Seleccione un chofer</option></select></label>
              <label class="field">Vehículo<select id="vehiculo" class="select" required><option value="">Seleccione un vehículo</option></select></label>
              <div class="field span-all">
                <label for="acompanante-agregar">Acompañantes</label>
                <div class="cell-flex">
                  <select id="acompanante-agregar" class="select"><option value="">Seleccione…</option></select>
                  <button type="button" class="btn" id="btn-agregar-acompanante"><svg class="i i-sm"><use href="#i-plus"/></svg>Agregar</button>
                </div>
                <div id="lista-acompanantes" class="chip-list" aria-live="polite"></div>
              </div>
              <label class="field">Requiere alojamiento<select id="alojamiento" class="select" required><option value="NO" selected>No</option><option value="SI">Sí</option></select></label>
            </div>
          </fieldset>
        </div>
        <div class="card-foot">
          <span id="mensaje" class="help" role="status"></span>
          <span class="spacer"></span>
          <button type="submit" class="btn btn-primary">Enviar solicitud</button>
        </div>
      </form>
      <datalist id="areas"><option value="Mantenimiento"><option value="Operaciones"><option value="Logística"></datalist>
      <datalist id="destinos"><option value="Pirquitas"><option value="Exar"><option value="SDJ"><option value="Rincón"><option value="ARLI"></datalist>
    </main>
  </div>
</div>

<script>
let personalBase = [];

function obtenerHoyLocal() {
  const hoy = new Date();
  const year = hoy.getFullYear();
  const month = String(hoy.getMonth() + 1).padStart(2, "0");
  const day = String(hoy.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function configurarRestriccionesFechas() {
  const fechaSalidaInput = document.getElementById("fecha_salida");
  const fechaRegresoInput = document.getElementById("fecha_regreso");
  const hoy = obtenerHoyLocal();

  fechaSalidaInput.min = hoy;
  fechaRegresoInput.min = fechaSalidaInput.value || hoy;
}

function etiquetaPersona(persona) {
  const nombre = (persona?.nombre || "").toString().trim();
  const legajo = (persona?.legajo || "").toString().trim();
  if (!nombre) {
    return "";
  }
  return legajo ? `${nombre} (Legajo ${legajo})` : nombre;
}

function etiquetaVehiculo(vehiculo) {
  const codigo = (vehiculo?.codigo || "").toString().trim();
  const descripcion = (
    vehiculo?.descripcion ||
    vehiculo?.equipo ||
    vehiculo?.modelo ||
    vehiculo?.marca ||
    ""
  ).toString().trim();
  return descripcion ? `${codigo} - ${descripcion}` : codigo;
}

let acompanantesSeleccionados = [];

function renderListaAcompanantes() {
  const lista = document.getElementById("lista-acompanantes");
  lista.innerHTML = acompanantesSeleccionados.length ? "" : '<span class="help">Sin acompañantes agregados</span>';
  acompanantesSeleccionados.forEach(nombre => {
    const li = document.createElement("span");
    li.className = "chip";
    li.innerHTML = `<span>${SMG.escapeHtml(nombre)}</span><button type="button" class="chip-x" aria-label="Quitar ${SMG.escapeHtml(nombre)}">${SMG.icon("x", "i-sm")}</button>`;
    li.querySelector(".chip-x").addEventListener("click", () => {
      acompanantesSeleccionados = acompanantesSeleccionados.filter(n => n !== nombre);
      renderListaAcompanantes();
      actualizarOpcionesAcompanantes();
    });
    lista.appendChild(li);
  });
}

function actualizarOpcionesAcompanantes() {
  const selectChofer = document.getElementById("chofer");
  const selectAgregar = document.getElementById("acompanante-agregar");
  const choferSeleccionado = (selectChofer.value || "").trim().toLowerCase();

  // Si el chofer elegido ya estaba agregado como acompañante, se saca de la lista.
  if (acompanantesSeleccionados.some(n => n.toLowerCase() === choferSeleccionado)) {
    acompanantesSeleccionados = acompanantesSeleccionados.filter(n => n.toLowerCase() !== choferSeleccionado);
    renderListaAcompanantes();
  }

  const valorPrevio = selectAgregar.value;
  selectAgregar.innerHTML = "";
  const opcionVacia = document.createElement("option");
  opcionVacia.value = "";
  opcionVacia.textContent = "Seleccione…";
  selectAgregar.appendChild(opcionVacia);

  personalBase
    .map(p => (p?.nombre || "").toString().trim())
    .filter(Boolean)
    .filter(nombre => nombre.toLowerCase() !== choferSeleccionado)
    .filter(nombre => !acompanantesSeleccionados.includes(nombre))
    .forEach(nombre => {
      const op = document.createElement("option");
      op.value = nombre;
      op.textContent = nombre;
      selectAgregar.appendChild(op);
    });

  selectAgregar.value = Array.from(selectAgregar.options).some(o => o.value === valorPrevio) ? valorPrevio : "";
}

function agregarAcompanante() {
  const selectAgregar = document.getElementById("acompanante-agregar");
  const nombre = (selectAgregar.value || "").trim();
  if (!nombre || acompanantesSeleccionados.includes(nombre)) {
    return;
  }
  acompanantesSeleccionados.push(nombre);
  renderListaAcompanantes();
  actualizarOpcionesAcompanantes();
}

async function cargarPersonalYVehiculos() {
  const [resPersonal, resVehiculos] = await Promise.all([
    fetch("/personal"),
    fetch("/vehiculos")
  ]);

  const personal = await resPersonal.json();
  const vehiculos = await resVehiculos.json();

  personalBase = (Array.isArray(personal) ? personal : [])
    .filter(p => (p?.activo || "ACTIVO") !== "INACTIVO");

  const selectChofer = document.getElementById("chofer");
  const selectVehiculo = document.getElementById("vehiculo");

  personalBase.forEach(persona => {
    const nombre = (persona?.nombre || "").toString().trim();
    if (!nombre) {
      return;
    }
    const op = document.createElement("option");
    op.value = nombre;
    op.textContent = etiquetaPersona(persona);
    selectChofer.appendChild(op);
  });

  (Array.isArray(vehiculos) ? vehiculos : []).forEach(vehiculo => {
    const codigo = (vehiculo?.codigo || "").toString().trim();
    if (!codigo) {
      return;
    }
    const op = document.createElement("option");
    op.value = etiquetaVehiculo(vehiculo);
    op.textContent = etiquetaVehiculo(vehiculo);
    selectVehiculo.appendChild(op);
  });

  actualizarOpcionesAcompanantes();
}

document.getElementById("fecha_salida").addEventListener("change", function() {
  const fechaRegresoInput = document.getElementById("fecha_regreso");
  const hoy = obtenerHoyLocal();
  const minRegreso = this.value || hoy;
  fechaRegresoInput.min = minRegreso;

  if (fechaRegresoInput.value && fechaRegresoInput.value < minRegreso) {
    fechaRegresoInput.value = minRegreso;
  }
});

document.getElementById("chofer").addEventListener("change", actualizarOpcionesAcompanantes);
document.getElementById("btn-agregar-acompanante").addEventListener("click", agregarAcompanante);

document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();
  if (!this.reportValidity()) return;

  try {
    const fechaSalida = document.getElementById("fecha_salida").value;
    const fechaRegreso = document.getElementById("fecha_regreso").value;
    const hoy = obtenerHoyLocal();

    if (fechaSalida < hoy) {
      SMG.toast("La fecha de salida debe ser hoy o posterior", "error");
      return;
    }

    if (fechaRegreso < fechaSalida) {
      SMG.toast("La fecha de regreso no puede ser menor que la de salida", "error");
      return;
    }

    const data = {
      solicitante: document.getElementById("solicitante").value,
      area: document.getElementById("area").value,
      origen: document.getElementById("origen").value,
      destino: document.getElementById("destino").value,
      motivo: document.getElementById("motivo").value,
      fecha_salida: fechaSalida,
      fecha_regreso: fechaRegreso,
      chofer: document.getElementById("chofer").value,
      vehiculo: document.getElementById("vehiculo").value,
      acompanantes: acompanantesSeleccionados.slice(),
      alojamiento: document.getElementById("alojamiento").value
    };

    const res = await fetch("/viajes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    if (!res.ok || result.error) throw new Error(result.error || result.detail || `Error ${res.status}`);

    document.getElementById("mensaje").innerText = "Viaje creado correctamente (ID: " + result.id + ")";
    SMG.toast("Viaje creado correctamente (ID: " + result.id + ")");

    document.getElementById("form").reset();
    acompanantesSeleccionados = [];
    renderListaAcompanantes();
    actualizarOpcionesAcompanantes();

  } catch (error) {
    console.error("ERROR:", error);
    SMG.toast("Error al enviar la solicitud", "error");
  }
});

renderListaAcompanantes();

// Auto-resize textarea motivo
document.getElementById("motivo").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});

configurarRestriccionesFechas();
cargarPersonalYVehiculos().catch(error => {
  console.error("No se pudieron cargar Personal/Vehiculos:", error);
  document.getElementById("mensaje").innerText = "No se pudieron cargar opciones de chofer y vehículo";
});
</script>
</body>
</html>

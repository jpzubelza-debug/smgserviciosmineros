<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes de salida · SMG</title>
  <link rel="icon" href="/Imagenes/smg-icono-192.png">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/shell.js"></script>
</head>

<body data-titulo="Órdenes de salida">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content" id="contenido">
      <div class="page-head">
        <div>
          <h1>Órdenes de salida</h1>
          <p class="page-sub">Detalle completo de los viajes asignados y cierre logístico</p>
        </div>
        <div class="head-actions">
          <button id="btn-recargar" type="button" class="btn"><svg class="i i-sm"><use href="#i-refresh"/></svg>Recargar</button>
          <button id="btn-imprimir" type="button" class="btn btn-primary"><svg class="i i-sm"><use href="#i-printer"/></svg>Imprimir</button>
        </div>
      </div>

      <section class="card" aria-label="Selección de orden">
        <div class="filter-bar">
          <label class="field span-all">Orden de salida<select id="selector-os" class="select"></select></label>
          <label class="field">Buscar<input id="busqueda-os" class="input" type="search" placeholder="N.º OS, ID de viaje, solicitante o destino"></label>
          <div class="filter-actions"><label class="check" for="filtro-cerradas"><input id="filtro-cerradas" type="checkbox">Solo OS cerradas</label></div>
        </div>
      </section>

      <div id="listado" class="stack form-wide"></div>
    </main>
  </div>
</div>

<script>
let ordenesCache = [];
let ordenesFiltradas = [];
let nominaPersonal = [];
let nominaVehiculos = [];
let puedeEditarOrdenCerrada = false;
let edicionManualHabilitada = false;
let ultimoNroOrdenRenderizado = null;

async function cargarPerfilActual() {
  try {
    const res = await fetch("/me");
    const me = await res.json();
    const tipo = String(me?.tipo_usuario || "").toUpperCase();
    puedeEditarOrdenCerrada = !!me?.autenticado && (tipo === "JEFE DE AREA" || tipo === "ADMINISTRADOR");
  } catch (error) {
    puedeEditarOrdenCerrada = false;
  }
}

function esc(valor) {
  const div = document.createElement("div");
  div.textContent = valor ?? "";
  return div.innerHTML;
}

function renderItems(obj) {
  return Object.entries(obj || {})
    .map(([k, v]) => {
      const valor = typeof v === "object" ? JSON.stringify(v, null, 2) : String(v ?? "");
      return `<div class="field">${esc(k)}<span class="input is-static">${esc(valor)}</span></div>`;
    })
    .join("");
}

function estaOrdenCerrada(orden) {
  const estadoOrden = String(orden?.estado || "").toUpperCase();
  const estadoViaje = String(orden?.viaje?.estado || "").toUpperCase();
  const cierreLogistica = (orden?.cierre_logistica && typeof orden.cierre_logistica === "object")
    ? orden.cierre_logistica
    : null;
  const cerradoFlag = String(cierreLogistica?.cerrado || "").toUpperCase() === "TRUE";
  const cerradoPorCierre = Boolean(cierreLogistica?.cerrado) || cerradoFlag || Boolean(cierreLogistica?.fecha_guardado);
  return cerradoPorCierre || estadoOrden.startsWith("CERRAD") || estadoViaje.startsWith("CERRAD");
}

function normalizarBusqueda(valor) {
  return String(valor || "").toLowerCase().trim();
}

function coincideBusquedaOrden(orden, termino) {
  if (!termino) {
    return true;
  }

  const solicitante = orden?.recursos?.datos_solicitante || orden?.viaje?.solicitante || "";
  const destino = orden?.recursos?.destino || orden?.viaje?.destino || "";
  const texto = [
    orden?.nro_orden || "",
    orden?.id_viaje || "",
    orden?.fecha_orden || "",
    solicitante,
    destino,
  ].join(" ").toLowerCase();

  return texto.includes(termino);
}

async function cargarNominaPersonal() {
  try {
    const res = await fetch("/personal");
    const data = await res.json();
    const nombres = Array.isArray(data)
      ? data
          .filter((p) => (p?.activo || "ACTIVO") !== "INACTIVO")
          .map((p) => String(p?.nombre || "").trim())
          .filter((n) => n.length > 0)
      : [];
    nominaPersonal = Array.from(new Set(nombres)).sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
  } catch (error) {
    nominaPersonal = [];
    console.warn("No se pudo cargar la nómina de personal", error);
  }
}

async function cargarNominaVehiculos() {
  try {
    const res = await fetch("/vehiculos");
    const data = await res.json();
    const opciones = [];

    if (Array.isArray(data)) {
      data.forEach((v) => {
        const codigo = String(v?.codigo || "").trim();
        const dominio = String(v?.dominio || "").trim();
        const marca = String(v?.marca || "").trim();
        const modelo = String(v?.modelo || "").trim();

        if (codigo) {
          opciones.push(codigo);
        }
        if (dominio) {
          opciones.push(dominio);
        }
        const descripcion = [codigo, marca, modelo, dominio].filter((x) => x.length > 0).join(" | ");
        if (descripcion) {
          opciones.push(descripcion);
        }
      });
    }

    nominaVehiculos = Array.from(new Set(opciones)).sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
  } catch (error) {
    nominaVehiculos = [];
    console.warn("No se pudo cargar la nómina de vehículos", error);
  }
}

function sumarDias(fechaBase, dias) {
  const base = new Date(`${fechaBase}T00:00:00`);
  if (Number.isNaN(base.getTime())) {
    return "";
  }
  base.setDate(base.getDate() + dias);
  return base.toISOString().slice(0, 10);
}

function renderFilasSeguimiento(duracionJornadas, fechaSalida = "", bloqueado = false) {
  const jornadas = Number.parseInt(duracionJornadas, 10);
  const total = Number.isFinite(jornadas) && jornadas > 0 ? jornadas : 1;
  const attrBloqueado = bloqueado ? "disabled" : "";

  let filas = "";
  for (let i = 1; i <= total; i += 1) {
    const fechaAuto = fechaSalida ? sumarDias(fechaSalida, i - 1) : "";
    filas += `
      <tr>
        <td class="mono">Día ${i}</td>
        <td><input type="date" class="input" aria-label="Fecha" value="${esc(fechaAuto)}" ${attrBloqueado}></td>
        <td><input type="time" class="input hs-inicio" aria-label="Hora de inicio" ${attrBloqueado}></td>
        <td><input type="time" class="input hs-final" aria-label="Hora final" ${attrBloqueado}></td>
        <td><input type="text" class="input" aria-label="Observaciones" placeholder="Observaciones" ${attrBloqueado}></td>
        <td><input type="text" class="input mono hs-acumuladas" aria-label="Horas acumuladas y extra" value="0.00 hs | Extra: 0.00 hs" readonly></td>
      </tr>
    `;
  }

  return filas;
}

function renderFilasSeguimientoConDatos(duracionJornadas, fechaSalida = "", detalleDias = [], bloqueado = false) {
  const attrBloqueado = bloqueado ? "disabled" : "";
  const detalle = Array.isArray(detalleDias) ? detalleDias : [];
  if (detalle.length === 0) {
    return renderFilasSeguimiento(duracionJornadas, fechaSalida, bloqueado);
  }

  return detalle.map((fila, idx) => {
    const dia = Number.parseInt(fila?.dia, 10) || (idx + 1);
    const fecha = fila?.fecha || "";
    const hsInicio = fila?.hs_inicio || "";
    const hsFinal = fila?.hs_final || "";
    const observaciones = fila?.observaciones || "";
    const resumen = fila?.resumen_horas || "0.00 hs | Extra: 0.00 hs";
    const extraHoras = Number.isFinite(Number(fila?.extra_horas)) ? Number(fila?.extra_horas) : 0;

    return `
      <tr data-extra-horas="${esc(String(extraHoras))}">
        <td class="mono">Día ${esc(String(dia))}</td>
        <td><input type="date" class="input" aria-label="Fecha" value="${esc(fecha)}" ${attrBloqueado}></td>
        <td><input type="time" class="input hs-inicio" aria-label="Hora de inicio" value="${esc(hsInicio)}" ${attrBloqueado}></td>
        <td><input type="time" class="input hs-final" aria-label="Hora final" value="${esc(hsFinal)}" ${attrBloqueado}></td>
        <td><input type="text" class="input" aria-label="Observaciones" placeholder="Observaciones" value="${esc(observaciones)}" ${attrBloqueado}></td>
        <td><input type="text" class="input mono hs-acumuladas" aria-label="Horas acumuladas y extra" value="${esc(resumen)}" readonly></td>
      </tr>
    `;
  }).join("");
}

function renderBloqueoOrdenCerrada() {
  return `
    <div class="callout warn" role="status">${SMG.icon("info")}<div><b>Orden cerrada.</b> La información se muestra en modo solo lectura.</div></div>
  `;
}

function renderEdicionOrdenCerrada() {
  return `
    <div class="callout info" role="status">${SMG.icon("pencil")}<div><b>Orden cerrada · edición habilitada (rol Jefe de Área).</b> Los cambios que guarde reemplazarán los datos ya cargados.</div></div>
  `;
}

function renderHabilitarEdicionOrdenCerrada() {
  return `
    <div class="callout info" role="status">${SMG.icon("info")}<div><b>Orden cerrada.</b> Su rol permite corregir esta orden.
      <div class="cell-flex" style="margin-top:var(--s2)"><button type="button" class="btn btn-sm" onclick="habilitarEdicionOrdenCerrada()">${SMG.icon("pencil", "i-sm")}Habilitar edición</button></div></div></div>
  `;
}

function habilitarEdicionOrdenCerrada() {
  edicionManualHabilitada = true;
  renderOrdenSeleccionada(obtenerOrdenActualSeleccionada());
}

function timeToMinutes(value) {
  if (!value || !value.includes(":")) {
    return null;
  }
  const [h, m] = value.split(":").map(Number);
  if (!Number.isFinite(h) || !Number.isFinite(m)) {
    return null;
  }
  return (h * 60) + m;
}

function actualizarHorasFila(fila) {
  const inicioInput = fila.querySelector(".hs-inicio");
  const finalInput = fila.querySelector(".hs-final");
  const salidaInput = fila.querySelector(".hs-acumuladas");

  if (!inicioInput || !finalInput || !salidaInput) {
    return;
  }

  const inicioMin = timeToMinutes(inicioInput.value);
  const finalMin = timeToMinutes(finalInput.value);

  if (inicioMin === null || finalMin === null) {
    fila.dataset.extraHoras = "0";
    salidaInput.value = "0.00 hs | Extra: 0.00 hs";
    actualizarTotalExtrasSeguimiento();
    return;
  }

  let minutos = finalMin - inicioMin;
  if (minutos < 0) {
    minutos += 24 * 60;
  }

  const horas = minutos / 60;
  const extra = Math.max(horas - 10, 0);
  fila.dataset.extraHoras = String(extra);
  salidaInput.value = `${horas.toFixed(2)} hs | Extra: ${extra.toFixed(2)} hs`;
  actualizarTotalExtrasSeguimiento();
}

function actualizarTotalExtrasSeguimiento() {
  const filas = document.querySelectorAll("#seguimiento-body tr");
  let totalExtra = 0;

  filas.forEach((fila) => {
    const extra = Number(fila.dataset.extraHoras || 0);
    if (Number.isFinite(extra)) {
      totalExtra += extra;
    }
  });

  const totalInput = document.getElementById("seguimiento-total-extra");
  if (totalInput) {
    totalInput.value = `${totalExtra.toFixed(2)} hs`;
  }
}

function activarCalculoHorasSeguimiento() {
  const filas = document.querySelectorAll("#seguimiento-body tr");
  filas.forEach((fila) => {
    const inicioInput = fila.querySelector(".hs-inicio");
    const finalInput = fila.querySelector(".hs-final");
    const salidaInput = fila.querySelector(".hs-acumuladas");
    if (inicioInput) {
      inicioInput.addEventListener("change", () => actualizarHorasFila(fila));
    }
    if (finalInput) {
      finalInput.addEventListener("change", () => actualizarHorasFila(fila));
    }

    const tieneResumenGuardado = Boolean((salidaInput?.value || "").trim());
    if (!tieneResumenGuardado) {
      actualizarHorasFila(fila);
    }
  });
  actualizarTotalExtrasSeguimiento();
}

function formatearSoloFecha(valor) {
  if (!valor) {
    return "";
  }
  return String(valor).slice(0, 10);
}

function calcularJornadas(fechaSalida, fechaLlegada) {
  if (!fechaSalida || !fechaLlegada) {
    return 1;
  }

  const salida = new Date(`${fechaSalida}T00:00:00`);
  const llegada = new Date(`${fechaLlegada}T00:00:00`);
  const msPorDia = 24 * 60 * 60 * 1000;
  const diferencia = Math.floor((llegada - salida) / msPorDia) + 1;
  return diferencia > 0 ? diferencia : 1;
}

function renderDatosSolicitud(orden, viaje, recursos, bloqueado = false) {
  const fechaEmision = orden.fecha_orden || "";
  const centroCosto = recursos.centro_costo || "";
  const quienSolicita = recursos.datos_solicitante || viaje.solicitante || "";
  const areaSolicita = recursos.area_solicitante || viaje.area || "";
  const partida = recursos.partida || viaje.origen || "";
  const destino = recursos.destino || viaje.destino || "";
  const motivo = recursos.motivo_viaje || viaje.motivo || "";
  const fechaSalida = formatearSoloFecha(recursos.fecha_salida_viaje || viaje.fecha_salida || "");
  const fechaLlegada = formatearSoloFecha(recursos.fecha_regreso_viaje || viaje.fecha_regreso || "");
  const horaIngresoBase = recursos.hora_ingreso_base || "";
  const horaSalida = recursos.hora_salida || "";
  const horaRegreso = recursos.hora_regreso || "";
  const jornadas = calcularJornadas(fechaSalida, fechaLlegada);
  const attrBloqueado = bloqueado ? "disabled" : "";

  return `
    <div class="form-grid">
      <div class="field">
        <label>Fecha de emisión</label>
        <input class="input" id="sol-fecha-emision" type="text" value="${esc(fechaEmision)}" readonly ${attrBloqueado}>
      </div>
      <div class="field">
        <label>Centro de costos</label>
        <input class="input" id="sol-centro-costos" type="text" value="${esc(centroCosto)}" readonly ${attrBloqueado}>
      </div>
      <div class="field">
        <label>Quién solicita</label>
        <input class="input" id="sol-quien-solicita" type="text" value="${esc(quienSolicita)}" readonly ${attrBloqueado}>
      </div>
      <div class="field">
        <label>Área que solicita</label>
        <input class="input" id="sol-area-solicita" type="text" value="${esc(areaSolicita)}" readonly ${attrBloqueado}>
      </div>
      <div class="field">
        <label>Partida</label>
        <input class="input" id="sol-partida" type="text" value="${esc(partida)}" readonly ${attrBloqueado}>
      </div>
      <div class="form-grid span-all">
        <div class="field">
          <label>Destino</label>
          <input class="input" id="sol-destino" type="text" value="${esc(destino)}" readonly ${attrBloqueado}>
        </div>
        <div class="field">
          <label>Fecha de salida (editable)</label>
          <input class="input" id="solicitud-fecha-salida" type="date" value="${esc(fechaSalida)}" ${attrBloqueado}>
        </div>
        <div class="field">
          <label>Fecha de llegada (editable)</label>
          <input class="input" id="solicitud-fecha-llegada" type="date" value="${esc(fechaLlegada)}" ${attrBloqueado}>
        </div>
        <div class="field">
          <label>Duración (jornadas)</label>
          <input class="input" id="solicitud-duracion-jornadas" type="text" value="${esc(String(jornadas))}" readonly ${attrBloqueado}>
        </div>
      </div>
      <div class="field span-all">
        <label>Motivo del viaje</label>
        <textarea class="textarea" id="sol-motivo" readonly rows="4" ${attrBloqueado}>${esc(motivo)}</textarea>
      </div>
      <div class="form-grid span-all">
        <div class="field">
          <label>Hora de ingreso a base</label>
          <input class="input" id="sol-hora-ingreso-base" type="time" value="${esc(horaIngresoBase)}" readonly ${attrBloqueado}>
        </div>
        <div class="field">
          <label>Hora de salida</label>
          <input class="input" id="sol-hora-salida" type="time" value="${esc(horaSalida)}" readonly ${attrBloqueado}>
        </div>
        <div class="field">
          <label>Hora de regreso</label>
          <input class="input" id="sol-hora-regreso" type="time" value="${esc(horaRegreso)}" readonly ${attrBloqueado}>
        </div>
      </div>
    </div>
  `;
}

function renderDatalistNominaAcompanantes() {
  if (!Array.isArray(nominaPersonal) || nominaPersonal.length === 0) {
    return '<datalist id="nomina-acompanantes"></datalist>';
  }

  const opciones = nominaPersonal
    .map((n) => `<option value="${esc(n)}"></option>`)
    .join("");

  return `<datalist id="nomina-acompanantes">${opciones}</datalist>`;
}

function renderDatalistNominaChoferes() {
  if (!Array.isArray(nominaPersonal) || nominaPersonal.length === 0) {
    return '<datalist id="nomina-choferes"></datalist>';
  }

  const opciones = nominaPersonal
    .map((n) => `<option value="${esc(n)}"></option>`)
    .join("");

  return `<datalist id="nomina-choferes">${opciones}</datalist>`;
}

function renderDatalistNominaVehiculos() {
  if (!Array.isArray(nominaVehiculos) || nominaVehiculos.length === 0) {
    return '<datalist id="nomina-vehiculos"></datalist>';
  }

  const opciones = nominaVehiculos
    .map((v) => `<option value="${esc(v)}"></option>`)
    .join("");

  return `<datalist id="nomina-vehiculos">${opciones}</datalist>`;
}

function renderFilaAcompanante(nombre = "", viatico = 0, bloqueado = false) {
  const valorNombre = String(nombre || "").trim();
  const valorViatico = Number.isFinite(Number(viatico)) ? Number(viatico) : 0;
  const attrBloqueado = bloqueado ? "disabled" : "";

  return `
    <tr class="viaticos-row">
      <td><input type="text" class="input acomp-nombre-editable" list="nomina-acompanantes" placeholder="Acompañante" aria-label="Acompañante" value="${esc(valorNombre)}" ${attrBloqueado}></td>
      <td><input type="number" class="input num viatico-acompanante" min="0" step="0.01" aria-label="Viático" value="${esc(valorViatico.toFixed(2))}" ${attrBloqueado}></td>
      <td class="center"><button type="button" class="btn btn-ghost btn-sm btn-remove-acomp" onclick="quitarAcompanante(this)" ${attrBloqueado}>Quitar</button></td>
    </tr>
  `;
}

function obtenerNombreAcompananteDesdeFila(fila) {
  return (fila?.querySelector(".acomp-nombre-editable")?.value || "").trim();
}

function renderAcompanantesConViaticos(recursos, bloqueado = false) {
  const acompDet = Array.isArray(recursos.acompanantes_con_viatico) ? recursos.acompanantes_con_viatico : [];

  if (acompDet.length > 0) {
    return acompDet
      .map((a, idx) => {
        const nombre = a?.nombre || `Acompañante ${idx + 1}`;
        const viatico = Number(a?.viatico || 0);
        return renderFilaAcompanante(nombre, viatico, bloqueado);
      })
      .join("");
  }

  const acomp = Array.isArray(recursos.acompanantes) ? recursos.acompanantes : [];
  if (acomp.length === 0) {
    return renderFilaAcompanante("", 0, bloqueado);
  }

  return acomp
    .map((nombre) => renderFilaAcompanante(nombre || "", 0, bloqueado))
    .join("");
}

function inicializarFilaAcompanante(fila) {
  const inputViatico = fila.querySelector(".viatico-acompanante");

  if (inputViatico) {
    inputViatico.addEventListener("input", recalcularTotalAsignacion);
  }
}

function agregarFilaAcompanantePorHTML(htmlFila) {
  const lista = document.getElementById("lista-acompanantes-editable");
  if (!lista) {
    return;
  }

  const wrapper = document.createElement("tbody");   // las filas son <tr>: se parsean dentro de un tbody
  wrapper.innerHTML = htmlFila;
  const fila = wrapper.firstElementChild;
  if (!fila) {
    return;
  }

  lista.appendChild(fila);
  inicializarFilaAcompanante(fila);
}

function agregarAcompanante() {
  agregarFilaAcompanantePorHTML(renderFilaAcompanante("", 0));

  const lista = document.getElementById("lista-acompanantes-editable");
  const ultimaFila = lista?.lastElementChild;
  if (ultimaFila) {
    const inputNombre = ultimaFila.querySelector(".acomp-nombre-editable");
    if (inputNombre) {
      inputNombre.focus();
    }
  }

  recalcularTotalAsignacion();
}

function quitarAcompanante(btn) {
  const fila = btn?.closest(".viaticos-row");
  const lista = document.getElementById("lista-acompanantes-editable");
  if (!fila || !lista) {
    return;
  }
  fila.remove();

  if (lista.querySelectorAll(".viaticos-row").length === 0) {
    agregarAcompanante();
  }

  recalcularTotalAsignacion();
}

function construirDetalleItinerario(itinerario, rutas, paradas) {
  const texto = [itinerario, rutas, paradas].filter((valor) => String(valor || "").trim().length > 0).join("\n");
  const totalLineas = texto ? texto.split("\n").length : 1;
  return {
    texto,
    rows: Math.max(totalLineas + 1, 5),
  };
}

function renderDatosAsignacion(recursos, bloqueado = false) {
  const itinerario = recursos.itinerario || "";
  const rutas = recursos.rutas || "";
  const paradas = recursos.paradas || "";
  const chofer = recursos.chofer || "";
  const vehiculo = recursos.vehiculo || "";
  const choferViatico = Number(recursos.chofer_viatico || 0);
  const otrosGastos = Number(recursos.otros_gastos || 0);
  const medioPago = (recursos.medio_pago || "Caja").toString();
  const alojamiento = (recursos.alojamiento || "NO").toString();
  const comp = recursos.comprobacion_operaciones_logistica || {};
  const detalleItinerario = construirDetalleItinerario(itinerario, rutas, paradas);
  const attrBloqueado = bloqueado ? "disabled" : "";

  return `
    <div class="form-grid">
      <div class="field span-all">
        <label>Itinerario, rutas y paradas</label>
        <textarea class="textarea" readonly rows="${detalleItinerario.rows}" ${attrBloqueado}>${esc(detalleItinerario.texto)}</textarea>
      </div>

      <div class="field">
        <label>Chofer</label>
        ${renderDatalistNominaChoferes()}
        <input class="input" id="asig-chofer" type="text" list="nomina-choferes" value="${esc(chofer)}" ${attrBloqueado}>
      </div>

      <div class="field">
        <label>Vehículo</label>
        ${renderDatalistNominaVehiculos()}
        <input class="input" id="asig-vehiculo" type="text" list="nomina-vehiculos" value="${esc(vehiculo)}" ${attrBloqueado}>

function actualizarControlSegunFechas() {
  const salidaInput = document.getElementById("solicitud-fecha-salida");
  const llegadaInput = document.getElementById("solicitud-fecha-llegada");
  const duracionInput = document.getElementById("solicitud-duracion-jornadas");
  const seguimientoBody = document.getElementById("seguimiento-body");

  if (!salidaInput || !llegadaInput || !duracionInput || !seguimientoBody) {
    return;
  }

  if (salidaInput.value) {
    llegadaInput.min = salidaInput.value;
  } else {
    llegadaInput.min = "";
  }

  if (salidaInput.value && llegadaInput.value && llegadaInput.value < salidaInput.value) {
    llegadaInput.value = salidaInput.value;
  }

  const jornadas = calcularJornadas(salidaInput.value, llegadaInput.value);
  duracionInput.value = String(jornadas);
  seguimientoBody.innerHTML = renderFilasSeguimiento(jornadas, salidaInput.value, false);
  activarCalculoHorasSeguimiento();
}

function activarEventosSolicitud() {
  const salidaInput = document.getElementById("solicitud-fecha-salida");
  const llegadaInput = document.getElementById("solicitud-fecha-llegada");

  if (salidaInput) {
    salidaInput.addEventListener("change", actualizarControlSegunFechas);
  }
  if (llegadaInput) {
    llegadaInput.addEventListener("change", actualizarControlSegunFechas);
  }

  actualizarControlSegunFechas();
  activarCalculoHorasSeguimiento();
}

function recalcularTotalAsignacion() {
  const chofer = Number(document.getElementById("asig-viatico-chofer")?.value || 0);
  const otros = Number(document.getElementById("asig-otros-gastos")?.value || 0);
  const acompInputs = document.querySelectorAll(".viatico-acompanante");

  let sumaAcomp = 0;
  acompInputs.forEach((input) => {
    const valor = Number(input.value || 0);
    if (Number.isFinite(valor)) {
      sumaAcomp += valor;
    }
  });

  const total = chofer + sumaAcomp + otros;
  const totalInput = document.getElementById("asig-total");
  if (totalInput) {
    totalInput.value = total.toFixed(2);
  }
}

function activarEventosAsignacion() {
  const choferInput = document.getElementById("asig-viatico-chofer");
  const otrosInput = document.getElementById("asig-otros-gastos");
  const acompRows = document.querySelectorAll(".viaticos-row");

  if (choferInput) {
    choferInput.addEventListener("input", recalcularTotalAsignacion);
  }
  if (otrosInput) {
    otrosInput.addEventListener("input", recalcularTotalAsignacion);
  }
  acompRows.forEach((fila) => {
    inicializarFilaAcompanante(fila);
  });

  recalcularTotalAsignacion();
}

async function guardarCierreLogistica() {
  const orden = obtenerOrdenActualSeleccionada();
  const msg = document.getElementById("cierre-msg");

  if (!orden || !orden.nro_orden) {
    if (msg) {
      msg.textContent = "No hay una Orden de salida válida seleccionada.";
    }
    return;
  }

  const formData = new FormData();
  const payload = recolectarCierrePayload();
  console.log("Payload a guardar:", JSON.stringify(payload, null, 2));
  formData.append("payload", JSON.stringify(payload));

  const checklistFile = document.getElementById("adjunto-checklist")?.files?.[0];
  const formularioFile = document.getElementById("adjunto-formulario")?.files?.[0];

  if (checklistFile) {
    formData.append("checklist_mantenimiento", checklistFile);
  }
  if (formularioFile) {
    formData.append("formulario_logistica_viaje", formularioFile);
  }

  try {
    if (msg) {
      msg.textContent = "Guardando cierre logístico...";
    }

    const res = await fetch(`/ordenes/${encodeURIComponent(orden.nro_orden)}/cierre`, {
      method: "POST",
      body: formData,
    });
    const result = await res.json();

    if (result.error) {
      if (msg) {
        msg.textContent = result.error;
      }
      return;
    }

    if (msg) {
      msg.textContent = "Cierre logístico guardado correctamente.";
    }

    await cargarOrdenes(String(orden.nro_orden || ""));
  } catch (error) {
    if (msg) {
      msg.textContent = "No se pudo guardar el cierre logístico.";
    }
    console.error(error);
  }
}

function poblarSelector(ordenes) {
  const selector = document.getElementById("selector-os");
  selector.innerHTML = "";

  if (!Array.isArray(ordenes) || ordenes.length === 0) {
    selector.innerHTML = '<option value="">Sin órdenes para el filtro actual</option>';
    renderOrdenSeleccionada(null);
    return;
  }

  ordenes.forEach((orden, idx) => {
    const option = document.createElement("option");
    option.value = String(idx);
    const estadoTxt = estaOrdenCerrada(orden) ? "CERRADA" : "ABIERTA";
    option.textContent = `${orden.nro_orden || "SIN NUMERO"} | Viaje ID ${orden.id_viaje || "-"} | ${orden.fecha_orden || ""} | ${estadoTxt}`;
    selector.appendChild(option);
  });

  selector.value = "0";
  renderOrdenSeleccionada(ordenes[0]);
}

function aplicarFiltrosOrdenes(nroOrdenPreferida = "") {
  const soloCerradas = Boolean(document.getElementById("filtro-cerradas")?.checked);
  const termino = normalizarBusqueda(document.getElementById("busqueda-os")?.value || "");

  ordenesFiltradas = ordenesCache.filter((orden) => {
    if (soloCerradas && !estaOrdenCerrada(orden)) {
      return false;
    }
    return coincideBusquedaOrden(orden, termino);
  });

  poblarSelector(ordenesFiltradas);

  if (!nroOrdenPreferida || ordenesFiltradas.length === 0) {
    return;
  }

  const selector = document.getElementById("selector-os");
  const idx = ordenesFiltradas.findIndex((o) => String(o.nro_orden || "") === String(nroOrdenPreferida));
  if (idx >= 0 && selector) {
    selector.value = String(idx);
    renderOrdenSeleccionada(ordenesFiltradas[idx]);
  }
}

async function cargarOrdenes(nroOrdenPreferida = "") {
  await Promise.all([cargarNominaPersonal(), cargarNominaVehiculos()]);
  const res = await fetch("/ordenes");
  const ordenes = await res.json();

  ordenesCache = Array.isArray(ordenes) ? ordenes.slice().reverse() : [];
  aplicarFiltrosOrdenes(nroOrdenPreferida);
}

    cierre_snapshot: recolectarCierrePayload(),
    generado_en: new Date().toISOString(),
  };
  localStorage.setItem("os_print_payload", JSON.stringify(payload));

});

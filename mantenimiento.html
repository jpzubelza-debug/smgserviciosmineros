    $('rep-ok').addEventListener('click', async (e) => {
      const body = { origen: origen(), descripcion: $('rep-desc').value, codigo: $('rep-cod').value, cantidad: $('rep-cant').value, unidad: $('rep-uni').value,
        costo_unitario: $('rep-costo').value, referencia: $('rep-ref').value, producto_id: $('rep-prod').value,
        solicitud_detalle_id: $('rep-sol').value, remito_detalle_id: $('rep-rem').value };
      const pedir = !$('rep-pedir-box').hidden && $('rep-pedir').checked;
      if (pedir) body.series = $('rep-series').value.split('\n').map((x) => x.trim()).filter(Boolean);
      const r = await accion(e.target, () => post(`${API}/ordenes/${o.id}/repuestos${pedir ? '/almacen' : ''}`, body),
        pedir ? 'Pedido a Almacén: remito de entrega pendiente de autorización' : 'Repuesto agregado');
      if (r) { refrescar(); abrirOrden(o.id); }
    });
  }

  // ---------------------------------------------------------------- indicadores (etapa 3)
  const PERIODOS = [['30', 'Últimos 30 días'], ['90', '90 días'], ['365', '12 meses'], ['anio', 'Este año']];
  const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function rangoPeriodo(p) {
    const hasta = new Date();
    const desde = p === 'anio' ? new Date(hasta.getFullYear(), 0, 1) : new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate() - (Number(p) - 1));
    return [isoLocal(desde), isoLocal(hasta)];
  }
  const tablaInd = (cols, filas, vacio) => (filas.length
    ? `<div class="mt-scroll"><table class="mt-tbl"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${filas.join('')}</tbody></table></div>`
    : `<div class="muted small">${vacio}</div>`);

  async function pintarIndicadores() {
    const p = st.filtros.ind;
    $('vista').innerHTML = `${cabecera('Panel de mantenimiento', '<span id="ind-rango">Cargando…</span>',
        `${chips('ind', PERIODOS)}<button type="button" class="btn btn-icon" id="ind-act" title="Actualizar" aria-label="Actualizar"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>`)}
      <div id="ind" class="stack"><div class="card empty">Cargando…</div></div>`;
    enlazarBarra('ind', pintarIndicadores);
    $('ind-act').addEventListener('click', () => { pintarKpis(); pintarIndicadores(); });
    const [desde, hasta] = rangoPeriodo(p);
    let r;
    try { r = await api(`${API}/indicadores?desde=${desde}&hasta=${hasta}`); } catch (e) { if ($('ind')) $('ind').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    if (!$('ind') || st.tab !== 'indicadores' || st.filtros.ind !== p) return; // cambió de pestaña o de período mientras cargaba
    const s = r.resumen;
    const plata = (n) => `${esc(r.moneda)} ${num(n, 0)}`;
    const tarjeta = (valor, titulo, sub = '', nivel = '') => `<div class="card kpi ind-kpi ${nivel}"><div class="kpi-label">${titulo}</div><div class="kpi-value">${valor}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
    const unidad = (v, u) => `${v}<small>${u}</small>`;
    const max = Math.max(1, ...r.costo_mensual.map((x) => x.correctivo + x.preventivo));
    const verEq = tienePanel('equipos');
    const eqCelda = (ci, display) => `<td class="ind-eq" title="${esc(display)}">${verEq ? `<a href="#" data-eq="${esc(ci)}">${esc(display)}</a>` : esc(display)}</td>`;
    const total = (x) => x.OPERATIVO + x.FUNCIONAL + x.FUERA_DE_SERVICIO || 1;
    // Observaciones: lo que conviene mirar del período, armado con los mismos datos
    const obs = [];
    if (s.preventivos_vencidos) obs.push(['bad', 'alert', `${s.preventivos_vencidos} preventivo(s) vencido(s) hoy: generá la OT desde Preventivo.`]);
    if (s.preventivos_proximos) obs.push(['warn', 'clock', `${s.preventivos_proximos} preventivo(s) próximo(s) a vencer.`]);
    r.equipos_fallas.filter((e) => e.novedades >= 2).slice(0, 3).forEach((e) => obs.push(['warn', 'alert',
      `${esc(e.display)} acumula ${e.novedades} novedades en el período${e.pendientes ? ` (${e.pendientes} pendiente${e.pendientes > 1 ? 's' : ''})` : ''}.`]));
    r.mecanicos.filter((m) => m.alertas).slice(0, 3).forEach((m) => obs.push(['warn', 'users', `${esc(m.nombre)}: ${m.alertas} alerta(s) contra la Tarja.`]));
    if (s.ot_finalizadas && !s.horas_mecanicos) obs.push(['warn', 'info', 'Las OT finalizadas no tienen horas de cronómetro, así que la mano de obra queda en cero: revisá que los mecánicos usen Iniciar / Pausar en la app.']);
    if (s.disponibilidad_flota != null && s.disponibilidad_flota >= 95) obs.push(['ok', 'check', `Disponibilidad de la flota del ${num(s.disponibilidad_flota, 1)} % en el período.`]);
    if (!obs.length) obs.push(['ok', 'check', 'Sin observaciones para el período.']);
    const observaciones = `<div class="card ind-obs"><h3>Observaciones</h3><ul class="obs-list">${obs.map(([n, i, t]) => `<li class="obs-${n}"><svg class="i" aria-hidden="true"><use href="#i-${i}"/></svg><span>${t}</span></li>`).join('')}</ul></div>`;
    $('ind-rango').textContent = `Del ${fecha(r.desde)} al ${fecha(r.hasta)}`;
    $('ind').innerHTML = `
      <div class="kpis ind-kpis">
        ${tarjeta(s.disponibilidad_flota == null ? '—' : unidad(num(s.disponibilidad_flota, 1), '%'), 'Disponibilidad de la flota',
          `${s.disponibilidad_flota == null ? '' : `<div class="meter" style="margin-bottom:6px"><span style="width:${s.disponibilidad_flota}%;background:var(--success)"></span></div>`}Tiempo sin estar fuera de servicio`)}
        ${tarjeta(s.novedades, 'Novedades reportadas', `${s.novedades_cerradas_sin_ot} cerradas sin OT`)}
        ${tarjeta(s.ot_finalizadas, 'OT finalizadas', `${s.ot_correctivas} correctivas · ${s.ot_preventivas} preventivas`)}
        ${tarjeta(s.dias_medio_resolucion == null ? '—' : unidad(num(s.dias_medio_resolucion, 1), 'días'), 'Resolución media', 'de la novedad al cierre')}
        ${tarjeta(s.dias_medio_ot == null ? '—' : unidad(num(s.dias_medio_ot, 1), 'días'), 'Duración media de la OT', 'de creada a finalizada')}
        ${tarjeta(unidad(num(s.horas_mecanicos, 1), 'h'), 'Horas de mecánicos', 'cronómetro de las OT')}
        ${tarjeta(plata(s.costo_total), 'Costo de mantenimiento', `mano de obra ${plata(s.costo_mano_obra)} · repuestos ${plata(s.costo_repuestos)}`)}
        ${tarjeta(s.services ? `${s.services_a_tiempo} de ${s.services}` : '—', 'Services a tiempo', `hoy: ${s.preventivos_vencidos} vencidos · ${s.preventivos_proximos} próximos`, s.preventivos_vencidos ? 'is-danger' : '')}
      </div>
      <div class="ind-grid">
        <div class="card ind-card"><h3>Costo por mes (OT finalizadas)</h3>
          <div class="ind-barras">${r.costo_mensual.map((x) => `<div class="ind-mes" title="${x.mes}: correctivo ${plata(x.correctivo)} · preventivo ${plata(x.preventivo)}">
            <div class="ind-col"><i class="corr" style="height:${(100 * x.correctivo) / max}%"></i><i class="prev" style="height:${(100 * x.preventivo) / max}%"></i></div>
            <span>${x.mes.slice(5)}/${x.mes.slice(2, 4)}</span></div>`).join('')}</div>
          <div class="small muted"><i class="ley corr"></i> Correctivo ${plata(s.costo_correctivo)} &nbsp; <i class="ley prev"></i> Preventivo ${plata(s.costo_preventivo)}</div></div>
        ${observaciones}
        <div class="card ind-card"><h3>Costo por equipo</h3>${tablaInd(['Equipo', 'OT', 'Horas', 'Mano de obra', 'Repuestos', 'Total'],
          r.costo_por_equipo.map((e) => `<tr>${eqCelda(e.ci, e.display)}<td class="num">${e.ots}</td><td class="num">${num(e.horas, 1)}</td>
            <td class="num">${plata(e.mano_obra)}</td><td class="num">${plata(e.repuestos)}</td><td class="num"><b>${plata(e.total)}</b></td></tr>`),
          'Sin OT finalizadas en el período.')}</div>
        <div class="card ind-card"><h3>Disponibilidad (equipos con días fuera de servicio o funcionales)</h3>${tablaInd(['Equipo', 'Disponible', 'Días', 'Fuera de servicio'],
          r.disponibilidad.map((e) => `<tr>${eqCelda(e.ci, e.display)}<td class="num"><b>${num(e.disponibilidad, 1)}%</b></td>
            <td><div class="ind-barra" title="Operativo ${num(e.dias.OPERATIVO, 1)} d · Funcional ${num(e.dias.FUNCIONAL, 1)} d · Fuera de servicio ${num(e.dias.FUERA_DE_SERVICIO, 1)} d">
              <i class="op" style="width:${(100 * e.dias.OPERATIVO) / total(e.dias)}%"></i><i class="fu" style="width:${(100 * e.dias.FUNCIONAL) / total(e.dias)}%"></i><i class="fs" style="width:${(100 * e.dias.FUERA_DE_SERVICIO) / total(e.dias)}%"></i></div></td>
            <td class="num">${num(e.dias.FUERA_DE_SERVICIO, 1)} d</td></tr>`),
          'Todos los equipos estuvieron operativos en el período.')}
          <div class="small muted" style="margin-top:6px"><i class="ley op"></i> Operativo &nbsp; <i class="ley fu"></i> Funcional &nbsp; <i class="ley fs"></i> Fuera de servicio</div></div>
        <div class="card ind-card"><h3>Fallas que se repiten</h3>${tablaInd(['Equipo', 'Novedades', 'Pendientes'],
          r.equipos_fallas.map((e) => `<tr>${eqCelda(e.ci, e.display)}<td class="num"><b>${e.novedades}</b></td><td class="num">${e.pendientes}</td></tr>`),
          'Sin novedades en el período.')}
          ${r.temas.length ? `<div class="small" style="margin-top:10px"><b>Temas más frecuentes:</b> ${r.temas.map((t) => `<span class="chip chip-accent" title="${t.equipos} equipo(s)">${esc(t.tema)} · ${t.novedades}</span>`).join(' ')}</div>` : ''}</div>
        <div class="card ind-card"><h3>Preventivo: services del período</h3>${tablaInd(['Fecha', 'Equipo', 'Plan', 'A tiempo'],
          r.services.map((v) => `<tr><td class="num">${fecha(v.fecha)}</td><td>${esc(v.ci)}</td><td>${esc(v.plan)}</td>
            <td>${v.a_tiempo ? '<span class="chip chip-ok">Sí</span>' : `<span class="chip chip-bad">Tarde</span> <span class="small muted">${esc(v.exceso)}</span>`}</td></tr>`),
          'Sin services registrados en el período.')}</div>
        <div class="card ind-card"><h3>Mecánicos</h3>${tablaInd(['Mecánico', 'Horas', 'OT', 'Alertas Tarja'],
          r.mecanicos.map((m) => `<tr><td>${esc(m.nombre)} <span class="muted small">${esc(m.legajo)}</span></td><td class="num">${num(m.horas, 1)}</td><td class="num">${m.ots}</td>
            <td class="num">${m.alertas ? `<span class="chip chip-warn">${m.alertas}</span>` : '0'}</td></tr>`),
          'Sin horas de cronómetro en el período.')}</div>
      </div>`;
    $('ind').querySelectorAll('[data-eq]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); abrirEquipo(a.dataset.eq); }));
  }

  // ---------------------------------------------------------------- equipos
  async function pintarEquipos(soloFiltro) {
    if (!soloFiltro) {
      $('vista').innerHTML = `${cabecera('Equipos', 'Estado, ubicación y actividad de la flota')}
        <div class="kpis" id="eq-kpis"></div>
        <div class="card"><div class="toolbar">${chips('eq', [['', 'Todos'], ['OPERATIVO', 'Operativos'], ['FUNCIONAL', 'Funcionales'], ['FUERA_DE_SERVICIO', 'Fuera de servicio']])}
          ${buscador('eq', 'Buscar equipo, tipo, ubicación…')}</div>${listaHtml()}</div>`;
      enlazarBarra('eq', () => pintarEquipos(true));
      st.equipos = await api(`${API}/equipos`);
      kpisEquipos();
    } else {
      $('vista').querySelectorAll('[data-f="eq"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === st.filtros.eq)));
    }
    const filas = st.equipos.filter((e) => (!st.filtros.eq || e.estado === st.filtros.eq) && coincide([e.display, e.tipo, e.ubicacion], st.buscar.eq));
    const origen = (e) => (e.ubicacion_origen === 'PARTE' ? `Parte ${fecha(e.ubicacion_desde)}` : e.ubicacion_origen === 'MANUAL' ? `Manual ${fecha(e.ubicacion_desde)}` : '<span class="muted">Sin partes</span>');
    if (!$('tabla')) return; // se cambió de pestaña mientras cargaba
    $('tabla').innerHTML = filas.length ? `<table class="mt-tbl"><thead><tr><th>Equipo</th><th>Tipo</th><th>Ubicación</th><th>Fuente</th><th>Estado</th><th>Desde</th>
      <th>Novedades</th><th>OT</th></tr></thead><tbody>${filas.map((e) => `
      <tr data-ci="${esc(e.ci)}"><td><b>${esc(e.display)}</b></td><td class="small">${esc(e.tipo)}</td><td>${esc(e.ubicacion) || '<span class="muted">—</span>'}</td>
      <td class="small">${origen(e)}</td><td>${badge(ESTADO_EQ, e.estado)}</td><td class="num">${e.dias_estado === null ? '—' : dias(e.dias_estado)}</td>
      <td class="num">${e.novedades_abiertas || ''}</td><td class="num">${e.ot_activas || ''}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No hay equipos con este filtro.</div>';
    pie(filas.length, st.equipos.length);
    $('tabla').querySelectorAll('tr[data-ci]').forEach((tr) => tr.addEventListener('click', () => abrirEquipo(tr.dataset.ci)));
  }

  function kpisEquipos() {
    const el = $('eq-kpis');
    if (!el) return;
    const total = st.equipos.length || 1;
    const de = (k) => st.equipos.filter((e) => e.estado === k);
    const op = de('OPERATIVO').length; const fu = de('FUNCIONAL').length; const fs = de('FUERA_DE_SERVICIO');
    el.innerHTML = `<div class="card kpi"><div class="kpi-label">Operativos</div><div class="kpi-value">${op}</div>
        <div class="meter"><span style="width:${(100 * op) / total}%;background:var(--success)"></span></div><div class="kpi-sub">${num((100 * op) / total, 1)} % de la flota</div></div>
      <div class="card kpi ${fu ? 'is-warning' : ''}"><div class="kpi-label">Funcionales</div><div class="kpi-value">${fu}</div><div class="kpi-sub">Trabajan con una novedad abierta o una restricción</div></div>
      <div class="card kpi ${fs.length ? 'is-danger' : ''}"><div class="kpi-label">Fuera de servicio</div><div class="kpi-value">${fs.length}</div>
        <div class="kpi-sub">${fs.length ? `${fs.slice(0, 5).map((e) => esc(e.ci)).join(' · ')}${fs.length > 5 ? ' …' : ''}` : 'Ninguno'}</div></div>`;
  }

  async function abrirEquipo(ci) {
    const h = await api(`${API}/equipos/${encodeURIComponent(ci)}`);
    const e = h.equipo;
    const editar = puede('equipos', 'cambiar_estado');
    const proyectos = [...new Set(st.op.centros_costos.map((c) => c.proyecto).filter(Boolean))].sort();
    drawer(`<h2>${esc(e.display)} ${badge(ESTADO_EQ, e.estado)}</h2><div class="muted">${esc(e.tipo)}</div>
      <h3>Estado y ubicación</h3><dl class="mt-kv">
      <dt>Estado</dt><dd>${badge(ESTADO_EQ, e.estado)} ${e.estado_desde ? `desde ${fecha(e.estado_desde)} (${dias(e.dias_estado)})` : ''}${e.estado_motivo ? `<div class="small muted">${esc(e.estado_motivo)}</div>` : ''}</dd>
      <dt>Ubicación</dt><dd>${esc(e.ubicacion) || '—'} <div class="small muted">${e.ubicacion_origen === 'PARTE' ? `Del último parte (${fecha(e.ubicacion_desde)})` : e.ubicacion_origen === 'MANUAL' ? `Manual desde ${fecha(e.ubicacion_desde)}: ${esc(e.ubicacion_motivo || '')}. Un parte posterior la reemplaza.` : 'Sin partes con fecha válida'}</div></dd>
      <dt>Último parte</dt><dd>${e.dias_sin_parte === null ? '—' : `hace ${e.dias_sin_parte} días`}</dd></dl>
      ${editar ? `<div class="box"><div class="grid2"><div class="field"><label>Nuevo estado</label>${selectorEstadoEquipo('e-est', e.estado, false)}</div>
        <div class="field"><label>Motivo</label><input class="input" id="e-mot"></div></div><div class="actions"><button class="btn" id="e-est-ok">Cambiar estado</button></div></div>
        <div class="box"><div class="grid2"><div class="field"><label>Proyecto</label><select class="input" id="e-proy"><option value="">Todos</option>${proyectos.map((p) => `<option>${esc(p)}</option>`).join('')}</select></div>
        <div class="field"><label>Centro de costo</label><select class="input" id="e-cc"><option value="">Elegir…</option>${opcionesCC()}</select></div></div>
        <div class="field" style="margin-top:8px"><label>Motivo</label><input class="input" id="e-umot" placeholder="p. ej. trasladado en carretón"></div>
        <div class="actions"><button class="btn" id="e-ubi-ok">Ubicar a mano</button></div></div>` : ''}
      <h3>Novedades</h3>${h.novedades.length ? `<ul class="mt-tl">${h.novedades.map((n) => `<li><b>#${n.id}</b> ${badge(ESTADO_NOV, n.estado)} ${esc(n.descripcion)} <span class="muted small">${fecha(n.creada_en)} · ${esc(n.reportada_por)}</span></li>`).join('')}</ul>` : '<div class="muted">Sin novedades.</div>'}
      <h3>Órdenes de trabajo</h3>${h.ordenes.length ? `<ul class="mt-tl">${h.ordenes.map((o) => `<li><a href="#" data-ot="${o.id}"><b>${esc(o.numero)}</b></a> ${badge(ESTADO_OT, o.estado)} ${esc(o.titulo)} <span class="muted small">${fecha(o.creada_en)} · ${num(o.horas)} h</span></li>`).join('')}</ul>` : '<div class="muted">Sin OT.</div>'}
      <h3>Cambios de estado y ubicación</h3>${h.cambios.length ? `<ul class="mt-tl">${h.cambios.map((c) => `<li><b>${c.campo === 'ESTADO' ? 'Estado' : 'Ubicación'}</b>: ${esc(ESTADO_EQ[c.anterior] ? ESTADO_EQ[c.anterior][0] : c.anterior || '—')} → ${esc(ESTADO_EQ[c.nuevo] ? ESTADO_EQ[c.nuevo][0] : c.nuevo)} <span class="muted small">${fechaHora(c.creado_en)} · ${esc(c.usuario)}</span><div class="small">${esc(c.motivo || '')}</div></li>`).join('')}</ul>` : '<div class="muted">Sin cambios registrados.</div>'}`, (d) => {
      d.querySelectorAll('[data-ot]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); abrirOrden(a.dataset.ot); }));
      if (!editar) return;
      $('e-proy').addEventListener('change', () => {
        const p = $('e-proy').value;
        $('e-cc').innerHTML = '<option value="">Elegir…</option>' + st.op.centros_costos.filter((c) => !p || c.proyecto === p).map((c) => `<option value="${c.id}">${esc(c.texto)}</option>`).join('');
      });
      const tras = (r) => { if (r) { pintarKpis(); pintarEquipos(); abrirEquipo(ci); } };
      $('e-est-ok').addEventListener('click', async (ev) => tras(await accion(ev.target, () => post(`${API}/equipos/${encodeURIComponent(ci)}/estado`, { estado: $('e-est').value, motivo: $('e-mot').value }, 'PUT'), 'Estado actualizado')));
      $('e-ubi-ok').addEventListener('click', async (ev) => tras(await accion(ev.target, () => post(`${API}/equipos/${encodeURIComponent(ci)}/ubicacion`, { centro_costo_id: $('e-cc').value, motivo: $('e-umot').value }, 'PUT'), 'Ubicación actualizada')));
    });
  }

  // ---------------------------------------------------------------- check list
  const VALOR_CK = { BUENO: ['Bueno', 'b-ok'], REGULAR: ['Regular', 'b-warn'], MALO: ['Malo', 'b-bad'], NA: ['N/A', 'b-mut'], VIGENTE: ['Vigente', 'b-ok'], VENCIDA: ['Vencida', 'b-bad'] };
  const RESULTADO_CK = { APTO: ['Apto', 'b-ok'], NO_APTO: ['No apto', 'b-bad'] };
  const FAMILIA_TXT = { VIAL: 'Vial', MAQUINARIA: 'Maquinaria vial', REMOLQUE: 'Remolque' };
  const CAPA_TXT = { BASE: 'Base (todo equipo autopropulsado)', FAMILIA: 'Familia', MODULO: 'Módulos según el equipo' };
  st.filtros.ck = '';
  st.buscar.ck = '';

  async function pintarChecklist(soloFiltro) {
    if (!soloFiltro) {
      $('vista').innerHTML = `${cabecera('Check list', 'Inspecciones de equipos según la plantilla de cada tipo',
          puede('checklist', 'realizar') ? `<button class="btn btn-primary" id="btn-nuevo-ck">${conIcono('plus', 'Nuevo check list')}</button>` : '')}
        <div class="card"><div class="toolbar">${chips('ck', [['', 'Todos'], ['APTO', 'Apto'], ['NO_APTO', 'No apto']])}
          ${buscador('ck', 'Buscar equipo, tipo, realizado por…')}</div>${listaHtml()}</div>`;
      enlazarBarra('ck', pintarChecklist);
      const b = $('btn-nuevo-ck'); if (b) b.addEventListener('click', () => formChecklist());
      st.checklists = await api(`${API}/checklist?resultado=${st.filtros.ck}`);
    }
    const filas = st.checklists.filter((c) => coincide([c.display, c.tipo_equipo, c.realizado_por, c.operador], st.buscar.ck));
    if (!$('tabla')) return; // se cambió de pestaña mientras cargaba
    $('tabla').innerHTML = filas.length ? `<table class="mt-tbl"><thead><tr><th>#</th><th>Fecha</th><th>Equipo</th><th>Tipo</th><th>Resultado</th><th>Malos</th><th>Regulares</th><th>Novedades</th><th>Realizó</th></tr></thead><tbody>${filas.map((c) => `
      <tr data-id="${c.id}"><td class="muted">${c.id}</td><td class="num">${fecha(c.fecha)}</td><td><b>${esc(c.display)}</b></td><td class="small">${esc(c.tipo_equipo)}</td>
      <td>${badge(RESULTADO_CK, c.resultado)}</td><td class="num">${c.malos || ''}</td><td class="num">${c.regulares || ''}</td><td class="num">${c.novedades || ''}</td><td>${esc(c.realizado_por)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">Todavía no hay check list con este filtro.</div>';
    pie(filas.length, st.checklists.length);
    $('tabla').querySelectorAll('tr[data-id]').forEach((tr) => tr.addEventListener('click', () => abrirChecklist(tr.dataset.id)));
  }

  function formChecklist(ci = '') {
    $('vista').innerHTML = `${cabecera('Nuevo check list', 'Malo o Regular piden comentario y foto; cada Malo pasa a Novedades.', '<button type="button" class="btn" id="ck-volver">‹ Volver a la lista</button>')}
      <div class="card" style="padding:16px"><div class="grid2"><div class="field"><label>Equipo</label><select class="input" id="ck-ci"><option value="">Elegir…</option>${opcionesEquipos(ci)}</select></div><div></div></div>
      <div id="ck-form"></div></div>`;
    $('ck-volver').addEventListener('click', () => pintarChecklist());
    $('ck-ci').addEventListener('change', () => cargarFormChecklist($('ck-ci').value));
    if (ci) cargarFormChecklist(ci);
  }

  async function cargarFormChecklist(ci) {
    const cont = $('ck-form');
    if (!ci) { cont.innerHTML = ''; return; }
    cont.innerHTML = '<div class="empty">Armando el check list…</div>';
    let a;
    try { a = await api(`${API}/checklist/armar/${encodeURIComponent(ci)}`); } catch (e) { cont.innerHTML = `<div class="box">${esc(e.message)}</div>`; return; }
    const total = a.secciones.reduce((n, s) => n + s.items.length, 0);
    const botones = (it) => (it.tipo === 'VIGENCIA' ? ['VIGENTE', 'VENCIDA'] : ['BUENO', 'REGULAR', 'MALO']).concat(it.opcional ? ['NA'] : [])
      .map((v) => `<button type="button" class="chip" data-v="${v}">${VALOR_CK[v][0]}</button>`).join('');
    cont.innerHTML = `<div class="box" style="margin-top:12px"><dl class="mt-kv"><dt>Tipo de equipo</dt><dd>${esc(a.tipo_equipo)} · ${esc(FAMILIA_TXT[a.familia])}</dd>
        <dt>Estado</dt><dd>${badge(ESTADO_EQ, a.estado)}</dd><dt>Ubicación</dt><dd>${esc(a.ubicacion) || '—'}</dd></dl>
        <div class="grid2" style="margin-top:10px"><div class="field"><label>Horómetro</label><input class="input" id="ck-hs" inputmode="decimal" value="${a.cabecera.horometro ?? ''}"></div>
        <div class="field"><label>Kilómetros</label><input class="input" id="ck-km" inputmode="decimal" value="${a.cabecera.km ?? ''}"></div>
        <div class="field"><label>Operador</label><input class="input" id="ck-op" value="${esc(a.cabecera.operador || '')}"></div></div>
        <p class="small muted" style="margin:8px 0 0">Horómetro, km y operador salen del último parte; corregilos si hace falta. Malo o Regular piden comentario y foto; cada Malo pasa a Novedades.</p></div>
      ${a.secciones.map((s) => `<h3 class="ck-sec">${esc(s.modulo)} <span class="muted small" style="font-weight:400">· ${esc(CAPA_TXT[s.capa].split(' (')[0])}</span></h3>
        <div class="card">${s.items.map((it) => `<div class="ck-row" data-clave="${esc(it.clave)}" data-foto="${it.foto_obligatoria ? 1 : 0}">
          <div class="ck-txt">${esc(it.texto)} ${it.critico ? '<span class="chip chip-bad">Crítico</span>' : ''}${it.foto_obligatoria ? ' <span class="chip chip-accent">Foto</span>' : ''}</div>
          <div class="ck-vals">${botones(it)}</div>
          <div class="ck-extra" hidden><input class="input" data-com placeholder="Comentario"><input type="file" accept="image/jpeg,image/png" data-foto-in></div></div>`).join('')}</div>`).join('')}
      <div class="field" style="margin-top:14px"><label>Observaciones generales</label><textarea class="input" id="ck-obs"></textarea></div>
      <div class="actions"><button class="btn btn-primary" id="ck-enviar">Guardar check list</button><span class="muted small" id="ck-cuenta">0 de ${total} respondidos</span></div>`;
    const actualizar = () => { $('ck-cuenta').textContent = `${cont.querySelectorAll('.ck-row[data-valor]').length} de ${total} respondidos`; };
    cont.querySelectorAll('.ck-row').forEach((row) => {
      const extra = row.querySelector('.ck-extra');
      if (row.dataset.foto === '1') extra.hidden = false;
      row.querySelectorAll('.ck-vals .chip').forEach((b) => b.addEventListener('click', () => {
        row.querySelectorAll('.ck-vals .chip').forEach((x) => x.classList.toggle('on', x === b));
        row.dataset.valor = b.dataset.v;
        extra.hidden = !(['REGULAR', 'MALO', 'VENCIDA'].includes(b.dataset.v) || (row.dataset.foto === '1' && b.dataset.v !== 'NA'));
        actualizar();
      }));
    });
    $('ck-enviar').addEventListener('click', async (e) => {
      const sinResponder = [...cont.querySelectorAll('.ck-row:not([data-valor])')];
      if (sinResponder.length) { sinResponder[0].scrollIntoView({ block: 'center' }); toast(`Faltan ${sinResponder.length} ítems por responder.`, true); return; }
      const respuestas = {}; const fd = new FormData();
      cont.querySelectorAll('.ck-row').forEach((row) => {
        respuestas[row.dataset.clave] = { valor: row.dataset.valor, comentario: row.querySelector('[data-com]').value };
        const f = row.querySelector('[data-foto-in]').files[0];
        if (f && !row.querySelector('.ck-extra').hidden) fd.append(`foto__${row.dataset.clave}`, f);
      });
      fd.append('datos', JSON.stringify({ ci, horometro: $('ck-hs').value, km: $('ck-km').value, operador: $('ck-op').value, observaciones: $('ck-obs').value, respuestas }));
      e.target.disabled = true;
      try {
        const r = await fetch(`${API}/checklist`, { method: 'POST', body: fd, credentials: 'same-origin' });
        let d = null; try { d = await r.json(); } catch { /* sin JSON */ }
        if (!r.ok) throw new Error((d && typeof d.detail === 'string' && d.detail) || `Error ${r.status}`);
        toast(d.resultado === 'NO_APTO' ? 'Check list guardado: NO APTO' : 'Check list guardado', d.resultado === 'NO_APTO');
        pintarKpis(); await pintarChecklist(); abrirChecklist(d.id);
      } catch (err) { e.target.disabled = false; toast(err.message, true); }
    });
  }

  async function abrirChecklist(id) {
    const c = await api(`${API}/checklist/${id}`);
    const grupos = [];
    c.respuestas.forEach((r) => { const g = grupos.find((x) => x.modulo === r.modulo); if (g) g.items.push(r); else grupos.push({ modulo: r.modulo, items: [r] }); });
    const novedadesAbiertas = puede('novedades', 'consultar');
    drawer(`<h2>Check list #${c.id} ${badge(RESULTADO_CK, c.resultado)}</h2><div class="muted">${esc(c.display)} · ${esc(c.tipo_equipo)}</div>
      <h3>Cabecera</h3><dl class="mt-kv"><dt>Fecha</dt><dd>${fechaHora(c.creado_en)}</dd><dt>Realizó</dt><dd>${esc(c.realizado_por)}</dd>
      <dt>Horómetro / km</dt><dd>${c.horometro ?? '—'} hs · ${c.km ?? '—'} km</dd><dt>Operador</dt><dd>${esc(c.operador || '—')}</dd><dt>Ubicación</dt><dd>${esc(c.ubicacion || '—')}</dd>
      ${c.observaciones ? `<dt>Observaciones</dt><dd>${esc(c.observaciones)}</dd>` : ''}<dt>Resumen</dt><dd>${c.total_items} ítems · ${c.malos} malos · ${c.regulares} regulares · ${c.novedades} a Novedades</dd></dl>
      ${grupos.map((g) => `<h3>${esc(g.modulo)}</h3><table class="mt-tbl"><tbody>${g.items.map((r) => `<tr><td>${esc(r.item)}${r.critico ? ' <span class="chip chip-bad">Crítico</span>' : ''}${r.comentario ? `<div class="small muted">${esc(r.comentario)}</div>` : ''}</td>
        <td style="width:110px">${badge(VALOR_CK, r.valor)}${r.novedad_id ? `<div class="small">${novedadesAbiertas ? `<a href="#" data-nov="${r.novedad_id}">Novedad #${r.novedad_id}</a>` : `Novedad #${r.novedad_id}`}</div>` : ''}</td>
        <td style="width:70px">${r.tiene_foto ? `<a href="${API}/checklist/respuestas/${r.id}/foto" target="_blank" rel="noopener"><img src="${API}/checklist/respuestas/${r.id}/foto" alt="Foto" loading="lazy" style="width:56px;height:56px;object-fit:cover;border-radius:6px"></a>` : ''}</td></tr>`).join('')}</tbody></table>`).join('')}`, (d) => {
      d.querySelectorAll('[data-nov]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); abrirNovedad(a.dataset.nov); }));
    });
  }

  // ---------------------------------------------------------------- configuración
  async function pintarConfig() {
    const c = st.op.config || {};
    const editar = puede('configuracion', 'configurar');
    $('vista').innerHTML = `${cabecera('Configuración', 'Parámetros del módulo de mantenimiento', chips('cfg', [['general', 'General'], ['plantilla', 'Plantilla del check list']]))}<div id="cfg-vista"></div>`;
    $('vista').querySelectorAll('[data-f="cfg"]').forEach((b) => b.addEventListener('click', () => { st.filtros.cfg = b.dataset.v; pintarConfig(); }));
    const sub = st.filtros.cfg || 'general';
    $('vista').querySelectorAll('[data-f="cfg"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === sub)));
    const v = $('cfg-vista');
    if (sub === 'general') {
      // El valor hora puede venir guardado como "1.25e+06": se muestra el número completo
      const vh = Number(String(c.valor_hora_mecanico ?? '0').replace(',', '.'));
      v.innerHTML = `<div class="stack" style="max-width:880px">
        <div class="card"><div class="card-head"><div class="card-title">Horas del mecánico</div></div><div class="card-body">
          <div class="grid2"><div class="field"><label for="c-vh">Valor hora</label><input class="input" id="c-vh" inputmode="decimal" value="${esc(Number.isFinite(vh) ? String(vh) : c.valor_hora_mecanico || '0')}" ${editar ? '' : 'disabled'}><span class="help" id="c-vh-txt"></span></div>
          <div class="field"><label for="c-mon">Moneda</label><input class="input" id="c-mon" maxlength="10" value="${esc(c.moneda || 'ARS')}" ${editar ? '' : 'disabled'}></div></div>
          <p class="help" style="margin-top:12px">Las horas de cada OT salen del cronómetro de la app (Iniciar / Pausar). Costo de mano de obra = horas × valor hora.</p>
          ${editar ? '<div class="actions" style="justify-content:flex-end"><button type="button" class="btn btn-primary" id="c-ok">Guardar</button></div>' : ''}</div></div>
        <div class="card"><div class="card-head"><div class="card-title">Quién aprueba y quién finaliza</div></div><div class="card-body">
          <p class="help">Se asigna por usuario en <a class="btn-link" href="/administracion">Administración › Usuarios</a> › Mantenimiento: <b>Novedades › Aprobador</b> resuelve las novedades,
          <b>Órdenes › Administrador de Mantenimiento</b> finaliza o devuelve las OT y <b>Check list › Realizar</b> carga los check list.</p></div></div></div>`;
      const vhTxt = () => { const n = Number($('c-vh').value.replace(',', '.')); $('c-vh-txt').textContent = $('c-vh').value.trim() && Number.isFinite(n) ? `${$('c-mon').value.trim()} ${num(n, 2)} por hora` : ''; };
      $('c-vh').addEventListener('input', vhTxt);
      $('c-mon').addEventListener('input', vhTxt);
      vhTxt();
      const b = $('c-ok');
      if (b) b.addEventListener('click', async (e) => {
        const r = await accion(e.target, () => post(`${API}/config`, { valor_hora_mecanico: $('c-vh').value, moneda: $('c-mon').value }, 'PUT'), 'Configuración guardada');
        if (r) { st.op.config = r; e.target.disabled = false; }
      });
      return;
    }
    v.innerHTML = '<div class="empty">Cargando…</div>';
    const p = await api(`${API}/plantilla`);
    // plantilla
    const itemFila = (i, moduloId) => `<tr data-item-id="${i.id || ''}" data-modulo-id="${moduloId}">
        <td><input class="input" data-k="texto" value="${esc(i.texto || '')}" placeholder="Nuevo ítem" style="width:100%" ${editar ? '' : 'disabled'}></td>
        <td><select class="input" data-k="tipo" ${editar ? '' : 'disabled'}><option value="ESTADO" ${i.tipo !== 'VIGENCIA' ? 'selected' : ''}>Bueno/Regular/Malo</option><option value="VIGENCIA" ${i.tipo === 'VIGENCIA' ? 'selected' : ''}>Vigente/Vencida</option></select></td>
        ${['critico', 'opcional', 'foto_obligatoria', 'activo'].map((k) => `<td style="text-align:center"><input type="checkbox" data-k="${k}" ${(k === 'activo' ? i.activo !== 0 : i[k]) ? 'checked' : ''} ${editar ? '' : 'disabled'}></td>`).join('')}
        <td>${editar ? `<button class="btn" data-guardar-item>${i.id ? 'Guardar' : 'Agregar'}</button>` : ''}</td></tr>`;
    v.innerHTML = `<div class="box" style="margin-top:0">Qué módulos lleva cada equipo depende de su <b>tipo de equipo</b>, que se estandariza y configura en <b>Logística › Vehículos › Tipos de equipo</b>.</div>
      <p class="muted small">Los cambios valen para los próximos check list; los ya hechos guardan el texto de ese día. <b>Crítico</b>: en Malo da No apto y la novedad entra urgente. <b>Opcional</b>: admite N/A. <b>Foto</b>: pide foto siempre.</p>
      ${['BASE', 'FAMILIA', 'MODULO'].map((capa) => `<h3>${CAPA_TXT[capa]}</h3>${p.modulos.filter((m) => m.capa === capa).map((m) => `<details class="card" style="margin-bottom:8px;padding:8px 12px" ${m.activo ? '' : 'data-inactivo'}>
        <summary style="cursor:pointer;font-weight:600">${esc(m.nombre)}${m.familia ? ` <span class="muted small">· ${FAMILIA_TXT[m.familia]}</span>` : ''} <span class="muted small">· ${m.es_neumaticos ? 'filas por posición del equipo' : `${m.items.filter((i) => i.activo).length} ítems`}</span>${m.activo ? '' : ' <span class="chip chip-muted">Inactivo</span>'}</summary>
        ${m.es_neumaticos ? '<p class="small muted">Una fila por posición y por auxilio, según el tipo de equipo (o lo cargado en el equipo).</p>' : `<div class="mt-scroll"><table class="mt-tbl"><thead><tr><th>Ítem</th><th>Respuesta</th><th>Crítico</th><th>Opcional</th><th>Foto</th><th>Activo</th><th></th></tr></thead><tbody>
          ${m.items.map((i) => itemFila(i, m.id)).join('')}${editar ? itemFila({}, m.id) : ''}</tbody></table></div>`}
        </details>`).join('')}`).join('')}
      ${editar ? `<h3>Nuevo módulo</h3><div class="box"><div class="grid2"><div class="field"><label>Nombre</label><input class="input" id="nm-nombre"></div>
        <div class="field"><label>Capa</label><select class="input" id="nm-capa"><option value="MODULO">Módulo según el equipo</option><option value="BASE">Base</option><option value="FAMILIA:VIAL">Familia vial</option><option value="FAMILIA:MAQUINARIA">Familia maquinaria</option><option value="FAMILIA:REMOLQUE">Familia remolque</option></select></div></div>
        <div class="actions"><button class="btn" id="nm-ok">Crear módulo</button></div></div>` : ''}`;
    v.querySelectorAll('[data-guardar-item]').forEach((b) => b.addEventListener('click', async () => {
      const tr = b.closest('tr'); const id = tr.dataset.itemId;
      const datos = { modulo_id: Number(tr.dataset.moduloId) };
      tr.querySelectorAll('[data-k]').forEach((i) => { datos[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; });
      if (!id) datos.activo = true;
      const r = await accion(b, () => post(`${API}/plantilla/items${id ? `/${id}` : ''}`, datos, id ? 'PUT' : 'POST'), id ? 'Ítem guardado' : 'Ítem agregado');
      if (r) { if (id) b.disabled = false; else pintarConfig(); }
    }));
    const nm = $('nm-ok');
    if (nm) nm.addEventListener('click', async (e) => {
      const [capa, familia] = $('nm-capa').value.split(':');
      const r = await accion(e.target, () => post(`${API}/plantilla/modulos`, { nombre: $('nm-nombre').value, capa, familia }), 'Módulo creado');
      if (r) pintarConfig();
    });
  }

  iniciar().catch((e) => { $('vista').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
})();
</script>
<script src="/ui/anchos-auto.js" defer></script>
</body>
</html>
